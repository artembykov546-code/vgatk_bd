services:
  - type: static
    name: vgatk-bd
    publishDir: frontend
    buildCommand: echo "Сборка не требуется, frontend уже готов"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    routes:
      - type: rewrite
        source: /*
        destination: /pages/index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/images/*
        name: Cache-Control
        value: public, max-age=86400