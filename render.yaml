services:
  - type: web
    name: vgatk-bd
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    headers:
      # Отключаем кэширование для HTML файлов
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*.html
        name: Pragma
        value: no-cache
      - path: /*.html
        name: Expires
        value: 0
      # Кэшируем только статику (CSS, JS, картинки) на 1 день
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400