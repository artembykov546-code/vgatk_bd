[build]
  command = "npm install && npm run build"
  publish = "dist"

# SPA маршрутизация: все запросы идут на index.html, 
# а роутинг обрабатывается внутри JavaScript
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Заголовки безопасности для всего сайта
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Кэширование статики (изображения, CSS, JS) на 1 год
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"