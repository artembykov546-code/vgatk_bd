function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) {
        callback();
        return;
    }
    if (attempts > 100) {
        console.warn('⚠️ Шапка/сайдбар так и не отрисовались, продолжаем всё равно');
        callback();
        return;
    }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

function getMaxCourse(type) {

}

function hasCourseGrades(student, maxCourse) {
    if (!student) return false;
    for (var course = 1; course <= maxCourse; course++) {
        var sem1 = student['grade_' + course + '_sem1'];
        var sem2 = student['grade_' + course + '_sem2'];
        var year = student['grade_' + course + '_year'];

}

function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();

    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);

    setTimeout(function() {
        if (toast.parentElement) toast.remove();
    }, 5000);
}

async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) {
            window.location.href = '/index.html';
            return;
        }
        try {
            currentUser = JSON.parse(savedUser);
        } catch (e) {
            localStorage.removeItem('currentUser');
            window.location.href = '/index.html';
            return;
        }
    } else {
        currentUser = user;

        if (nameEl) nameEl.textContent = currentUser.name || currentUser.full_name || currentUser.login;

    });

    currentUserRole = currentUser.role || 'viewer';
    currentUserEmployeeId = currentUser.employee_id || null;
    
    isSuperAdmin = currentUserRole === 'super_admin';
    isAdmin = currentUserRole === 'admin';
    isTeacher = currentUserRole === 'teacher';

function formatDate(dateStr) {
    if (!dateStr) return '—';
    var d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function calculateAge(birthDate) {
    if (!birthDate) return '—';
    var birth = new Date(birthDate);
    var today = new Date();
    var age = today.getFullYear() - birth.getFullYear();
    var m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age;
}

function getStatusBadge(status) {
    if (status === 'active') return 'status-active';
    if (status === 'expelled') return 'status-inactive';
    if (status === 'academic') return 'status-academic';
    return 'status-graduated';
}

function getStatusText(status) {
    if (status === 'active') return '✅ Активен';
    if (status === 'expelled') return '❌ Отчислен';
    if (status === 'academic') return '📚 Академ. отпуск';
    return '🎓 Выпущен';
}

function getGenderBadge(gender) {
    if (gender === 'Мужской') return '<span class="gender-badge gender-male">👨 Мужской</span>';
    if (gender === 'Женский') return '<span class="gender-badge gender-female">👩 Женский</span>';
    return '';
}

function formatGrade(value) {
    if (value === null || value === undefined || value === '') return '—';
    var num = parseFloat(value);
    if (isNaN(num)) return '—';
    return num.toFixed(1).replace('.', ',');
}

function getGenderWord(gender, maleWord, femaleWord) {
    if (gender === 'Мужской') return maleWord;
    if (gender === 'Женский') return femaleWord;
    return maleWord;
}

function getAddresses(student) {
    if (!student) return [];
    try {
        if (student.addresses && typeof student.addresses === 'object') {
            return student.addresses;
        }
        if (student.addresses && typeof student.addresses === 'string') {
            return JSON.parse(student.addresses);
        }
    } catch (e) {
        console.error('Ошибка парсинга адресов:', e);
    }
    return [];
}

function canManageGroup(groupId) {
    if (isSuperAdmin || isAdmin) return true;
    if (isViewer) return false;
    if (isTeacher || isMaster) {
        return currentUserGroupIds.includes(groupId);
    }
    return false;
}

// ОТОБРАЖЕНИЕ СРЕДНЕГО БАЛЛА ПО КУРСАМ
// ============================================================

function renderGrades(student) {
    if (!student) return '';

    var type = student.type || '';
    var maxCourse = getMaxCourse(type);

    if (!hasCourseGrades(student, maxCourse)) {
        return '';
    }

    var html = 
        '<div class="item" style="grid-column:1/-1;flex-direction:column;align-items:stretch;gap:4px;">' +
            '<span class="label" style="width:100%;">📊 Средний балл по курсам</span>' +
            '<span class="value" style="width:100%;">';

    var courses = [
        { num: 1, label: '1 курс' },
        { num: 2, label: '2 курс' },
        { num: 3, label: '3 курс' }
    ];

    if (type === 'sso') {
        courses.push({ num: 4, label: '4 курс' });
    }

    courses.forEach(function(course) {
        var semester1 = student['grade_' + course.num + '_sem1'];
        var semester2 = student['grade_' + course.num + '_sem2'];
        var year = student['grade_' + course.num + '_year'];

        if (!semester1 && !semester2 && !year) return;

        var gradeHtml = 
            '<div class="grade-section">' +
                '<div class="grade-title">📘 ' + course.label + '</div>';

        if (semester1) {
            gradeHtml += 
                '<div class="grade-row">' +
                    '<span class="grade-label">1-ое полугодие:</span>' +
                    '<span class="grade-value">' + formatGrade(semester1) + '</span>' +
                '</div>';
        }
        if (semester2) {
            gradeHtml += 
                '<div class="grade-row">' +
                    '<span class="grade-label">2-ое полугодие:</span>' +
                    '<span class="grade-value">' + formatGrade(semester2) + '</span>' +
                '</div>';
        }
        if (year) {
            gradeHtml += 
                '<div class="grade-row">' +
                    '<span class="grade-label">За год:</span>' +
                    '<span class="grade-value"><strong>' + formatGrade(year) + '</strong></span>' +
                '</div>';
        }

        gradeHtml += '</div>';
        html += gradeHtml;
    });

    html += 
            '</span>' +
        '</div>';

    return html;
}

// ============================================================
// ОБЩЕЖИТИЕ
// ============================================================

function renderDormitory(student) {
    if (!student) return '';

    var livesInDorm = student.lives_in_dorm || false;
    var dormBlock = student.dorm_block || '';
    var dormCheckIn = student.dorm_check_in || '';
    var dormCheckOut = student.dorm_check_out || '';

    if (!livesInDorm && !dormBlock && !dormCheckIn) {
        return '';
    }

    var statusHtml = '';
    var dormStatusText = '';

    if (livesInDorm && dormCheckIn) {
        if (dormCheckOut) {
            statusHtml = '<span class="dorm-status-inactive">❌ Не проживает</span>';
            dormStatusText = 'не проживает';
        } else {
            statusHtml = '<span class="dorm-status-active">✅ Проживает</span>';
            dormStatusText = 'проживает';
        }
    } else {
        return '';
    }

    var genderWord = getGenderWord(student.gender, 'заселился', 'заселилась');
    var genderWordOut = getGenderWord(student.gender, 'выселился', 'выселилась');

    var datesHtml = '';
    if (dormCheckIn) {
        datesHtml = genderWord + ' ' + formatDate(dormCheckIn);
        if (dormCheckOut) {
            datesHtml += ' - ' + genderWordOut + ' ' + formatDate(dormCheckOut);
        }
    }

    return (
        '<div class="item" style="grid-column:1/-1;">' +
            '<span class="label">🏠 Общежитие</span>' +
            '<span class="value">' +
                '<div class="dormitory-card">' +
                    '<div class="dorm-row">' +
                        '<span><strong>Блок:</strong> ' + (dormBlock || '—') + '</span>' +
                        '<span><strong>' + (datesHtml || '—') + '</strong></span>' +
                        '<span>' + statusHtml + '</span>' +
                    '</div>' +
                '</div>' +
            '</span>' +
        '</div>'
    );
}

// ============================================================
// МОДАЛЬНЫЕ ОКНА
// ============================================================

function openModal(title, html, action, saveCallback) {
    currentAction = action;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('actionModal').classList.add('active');

    document.getElementById('modalSaveBtn').onclick = saveCallback;

    var modalElement = document.getElementById('actionModal');
    var handler = function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            var saveBtn = document.getElementById('modalSaveBtn');
            if (saveBtn && !saveBtn.disabled) {
                saveBtn.click();
            }
        }
    };
    modalElement.addEventListener('keydown', handler);

    var closeHandler = function() {
        modalElement.removeEventListener('keydown', handler);
    };
    document.getElementById('modalCloseBtn').addEventListener('click', closeHandler, { once: true });
    document.getElementById('modalCancelBtn').addEventListener('click', closeHandler, { once: true });
}

function closeModal() {
    document.getElementById('actionModal').classList.remove('active');
    currentAction = null;
}

                showToast('✅ Учащийся ' + student.full_name + ' восстановлен в группу!', 'success');
                window.location.href = '/students/profile.html?id=' + insertResult.data.id;

            } catch (error) {
                console.error('❌ Ошибка восстановления:', error);
                showToast('❌ Ошибка: ' + error.message, 'error');
            }
        });
    };
}

function bindDeleteButton() {
    document.getElementById('deleteStudentBtn').onclick = async function() {
        if (!canDelete) {
            showToast('❌ У вас нет прав на это действие', 'error');
            return;
        }

        if (!canManageGroup(studentGroupId)) {
            showToast('❌ Вы не можете управлять этой группой', 'error');
            return;
        }

        var result = await sb
            .from('students')
            .select('full_name, status, group_id')
            .eq('id', studentId)
            .single();

        if (!result.data) { showToast('❌ Учащийся не найден', 'error'); return; }

        var student = result.data;

        if (student.status === 'graduated') {
            showToast('❌ Нельзя удалить выпускника', 'error');
            return;
        }

        if (!confirm('⚠️ ВНИМАНИЕ! Вы собираетесь полностью удалить учащегося "' + student.full_name + '" из базы данных. Это действие НЕЛЬЗЯ будет отменить.\n\nВы уверены?')) return;
        if (!confirm('🔴 Последнее предупреждение! Удалить "' + student.full_name + '" НАВСЕГДА?')) return;

        try {
            await sb.from('student_parents').delete().eq('student_id', studentId);
            await sb.from('student_siblings').delete().eq('student_id', studentId);

            var deleteResult = await sb.from('students').delete().eq('id', studentId);
            if (deleteResult.error) throw deleteResult.error;

            showToast('✅ Учащийся "' + student.full_name + '" полностью удалён из базы данных', 'success');
            setTimeout(function() {
                if (student.group_id) {
                    window.location.href = '/students/group.html?id=' + student.group_id;
                } else {
                    window.location.href = '/students/index.html';
                }
            }, 1500);

        } catch (error) {
            console.error('❌ Ошибка удаления:', error);
            showToast('❌ Ошибка: ' + error.message, 'error');
        }
    };
}

async function loadStudent() {
    var profileCard = document.getElementById('profileCard');
    var subtitle = document.getElementById('studentSubtitle');

    if (!studentId) {
        subtitle.textContent = 'ID не указан';

            '<div class="empty-state">' +
                '<span class="icon">❌</span>' +

                '<a href="/students/index.html" class="btn btn-primary" style="margin-top:16px;">Вернуться к группам</a>' +
            '</div>';
        return;
    }

    try {
        var studentResult = await sb
            .from('students')
            .select('*')
            .eq('id', studentId)
            .single();

        if (studentResult.error) throw studentResult.error;

        var student = studentResult.data;

        if (!student) {
            subtitle.textContent = 'не найден';
            profileCard.innerHTML = 
                '<div class="empty-state">' +
                    '<span class="icon">❌</span>' +
                    '<h3>Учащийся не найден</h3>' +

                '</div>';
            return;
        }

        currentStudent = student;
        studentGroupId = student.group_id;

        var groupType = '';
        var groupName = '—';
        var groupTypeDisplay = '';
        if (student.group_id) {
            var groupResult = await sb
                .from('groups')
                .select('name, type')
                .eq('id', student.group_id)
                .single();
            if (groupResult.data) {
                groupName = groupResult.data.name;
                groupType = groupResult.data.type;
                groupTypeDisplay = groupResult.data.type;

        updateButtons(student.status);

        if (accountingData.length > 0) {
            accountingLinesHtml = accountingData.map(function(item) {
                var startDate = item.start ? formatDate(item.start) : '—';

                    oldAddressLines +=

// ============================================================
// УПРАВЛЕНИЕ КНОПКАМИ
// ============================================================

function updateButtons(status) {
    var isActive = status === 'active';
    var isExpelled = status === 'expelled';
    var isAcademic = status === 'academic';
    var isGraduated = status === 'graduated';

    var canManage = canManageGroup(studentGroupId);

    var showExpel = canManage && canUpdate && isActive;
    var showAcademic = canManage && canUpdate && isActive;
    var showDelete = canManage && canDelete && !isGraduated;
    var showEdit = canManage && canUpdate && !isGraduated;
    
    var showRestore = (isSuperAdmin || isAdmin) && (isExpelled || isAcademic);

    document.getElementById('expelStudentBtn').style.display = showExpel ? 'inline-flex' : 'none';
    document.getElementById('academicLeaveBtn').style.display = showAcademic ? 'inline-flex' : 'none';
    document.getElementById('deleteStudentBtn').style.display = showDelete ? 'inline-flex' : 'none';
    document.getElementById('editStudentBtn').style.display = showEdit ? 'inline-flex' : 'none';
    document.getElementById('restoreStudentBtn').style.display = showRestore ? 'inline-flex' : 'none';
    
    if (isViewer) {
        document.getElementById('expelStudentBtn').style.display = 'none';
        document.getElementById('academicLeaveBtn').style.display = 'none';
        document.getElementById('deleteStudentBtn').style.display = 'none';
        document.getElementById('editStudentBtn').style.display = 'none';
        document.getElementById('restoreStudentBtn').style.display = 'none';
    }
}

async function loadParents(studentId) {
    var container = document.getElementById('parentsContainer');
    var countEl = document.getElementById('parentsCount');

    try {
        var linksResult = await sb
            .from('student_parents')
            .select('parent_id')
            .eq('student_id', studentId);

        if (linksResult.error) throw linksResult.error;

        var links = linksResult.data;

        if (!links || links.length === 0) {
            countEl.textContent = '0';
            currentParents = [];
            container.innerHTML = '<div class="empty-state" style="padding:20px;"><p style="font-size:14px;">Нет данных</p></div>';
            return;
        }

        var parentIds = links.map(function(l) { return l.parent_id; });
        var parentsResult = await sb
            .from('parents')
            .select('*')
            .in('id', parentIds);

        if (parentsResult.error) throw parentsResult.error;

        var parents = parentsResult.data || [];
        currentParents = parents;
        countEl.textContent = parents.length;
        
        if (parents.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:20px;"><p style="font-size:14px;">Нет данных</p></div>';
            return;
        }

        container.innerHTML = parents.map(function(p) {
            return (
                '<div class="related-card">' +
                    '<div class="name">' + p.full_name + '</div>' +
                    '<div class="info">' +
                        '<span class="tag">' + (p.relation || 'Родитель') + '</span>' +
                        (p.birth_date ? ' • ' + formatDate(p.birth_date) + ' (' + calculateAge(p.birth_date) + ' лет)' : '') +
                        (p.marital_status ? ' • ' + p.marital_status : '') +
                    '</div>' +
                    (p.work_place ? '<div class="info">🏢 ' + p.work_place + (p.position ? ' — ' + p.position : '') + '</div>' : '') +
                    (p.phone ? '<div class="info">📱 ' + p.phone + '</div>' : '') +
                    (p.address ? '<div class="info">📍 ' + p.address + '</div>' : '') +
                '</div>'
            );
        }).join('');

    } catch (error) {
        console.error('❌ Ошибка загрузки родителей:', error);
        currentParents = [];
        container.innerHTML = '<div class="empty-state" style="padding:20px;"><p style="font-size:14px;">Ошибка загрузки</p></div>';
    }
}

async function loadSiblings(studentId) {
    var container = document.getElementById('siblingsContainer');
    var countEl = document.getElementById('siblingsCount');

    try {
        var linksResult = await sb
            .from('student_siblings')
            .select('sibling_id')
            .eq('student_id', studentId);

        if (linksResult.error) throw linksResult.error;

        var links = linksResult.data;

        if (!links || links.length === 0) {
            countEl.textContent = '0';
            currentSiblings = [];
            container.innerHTML = '<div class="empty-state" style="padding:20px;"><p style="font-size:14px;">Нет данных</p></div>';
            return;
        }

        var siblingIds = links.map(function(l) { return l.sibling_id; });
        var siblingsResult = await sb
            .from('siblings')
            .select('*')
            .in('id', siblingIds);

        if (siblingsResult.error) throw siblingsResult.error;

        var siblings = siblingsResult.data || [];
        currentSiblings = siblings;
        countEl.textContent = siblings.length;
        
        if (siblings.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:20px;"><p style="font-size:14px;">Нет данных</p></div>';
            return;
        }

        container.innerHTML = siblings.map(function(s) {
            return (
                '<div class="related-card">' +
                    '<div class="name">' + s.full_name + '</div>' +
                    '<div class="info">' +
                        '<span class="tag">' + (s.type || 'Брат/сестра') + '</span>' +

                docHtml += '<div class="address-line"><span class="address-label">' + typeLabel + ':</span> ' + (fullAddr || '—') + '</div>';
                var geoParts = [];
                if (addr.region) geoParts.push('Область: ' + addr.region);
                if (addr.district) geoParts.push('Район: ' + addr.district);
                if (addr.locality) geoParts.push('Нас. пункт: ' + addr.locality);
                if (geoParts.length > 0) {
                    docHtml += '<div class="address-detail">' + geoParts.join(' | ') + '</div>';
                }
            });
        } else if (s.address_reg || s.address_live || s.address_region || s.address_district || s.address_locality) {
            docHtml += '<div class="section-title">📍 Адреса</div>';
            if (s.address_region) docHtml += '<div class="address-line"><span class="address-label">Область:</span> ' + s.address_region + '</div>';
            if (s.address_district) docHtml += '<div class="address-line"><span class="address-label">Район:</span> ' + s.address_district + '</div>';
            if (s.address_locality) docHtml += '<div class="address-line"><span class="address-label">Нас. пункт:</span> ' + s.address_locality + '</div>';
            if (s.address_reg) docHtml += '<div class="address-line"><span class="address-label">Регистрация:</span> ' + s.address_reg + '</div>';
            if (s.address_live) docHtml += '<div class="address-line"><span class="address-label">Проживание:</span> ' + s.address_live + '</div>';
            if (s.street_input) docHtml += '<div class="address-line"><span class="address-label">Улица, дом:</span> ' + s.street_input + '</div>';
            if (s.living_with) docHtml += '<div class="address-line"><span class="address-label">Проживает с:</span> ' + s.living_with + '</div>';
        }

        var accountingData = s.accounting_data || [];
        if (accountingData.length > 0) {
            docHtml += '<div class="section-title">📋 Учёт</div>';
            accountingData.forEach(function(item) {
                var startDate = item.start ? formatDate(item.start) : '—';
                var endDate = item.end ? formatDate(item.end) : null;
                var isActive = !item.end || item.end === '';
                docHtml += '<div class="address-line"><span class="address-label">' + item.type + ':</span> ' + startDate + (endDate ? ' - ' + endDate : '') + ' ' + (isActive ? '(Активен)' : '(Снят)') + '</div>';
            });
        }

        if (s.expulsion_date) {
            docHtml += '<div class="section-title">📋 Статусные изменения</div>';
            docHtml += '<div class="address-line"><span class="address-label">❌ Отчислен:</span> ' + formatDate(s.expulsion_date) + (s.expulsion_order ? ', Приказ: ' + s.expulsion_order : '') + (s.expulsion_article ? ', Статья: ' + s.expulsion_article : '') + '</div>';
        }
        if (s.academic_leave_date) {
            docHtml += '<div class="address-line"><span class="address-label">📚 Академ. отпуск:</span> ' + formatDate(s.academic_leave_date) + (s.academic_leave_order ? ', Приказ: ' + s.academic_leave_order : '') + (s.academic_leave_reason ? ', Причина: ' + s.academic_leave_reason : '') + '</div>';
        }

        if (s.target_training) {
            docHtml += '<div class="section-title">🎯 Целевое обучение</div>';
            docHtml += '<div class="address-line"><span class="address-label">Заказчик:</span> ' + (s.target_customer || '—') + '</div>';
            docHtml += '<div class="address-line"><span class="address-label">№ договора:</span> ' + (s.target_contract || '—') + '</div>';
            docHtml += '<div class="address-line"><span class="address-label">Срок отработки:</span> ' + (s.target_years ? s.target_years + ' лет' : '—') + '</div>';
        }

        var livesInDorm = s.lives_in_dorm || false;
        var dormBlock = s.dorm_block || '';
        var dormCheckIn = s.dorm_check_in || '';
        var dormCheckOut = s.dorm_check_out || '';

        if (livesInDorm && dormBlock && dormCheckIn) {
            var dormStatusText = '✅ Проживает';
            var dormStatusClass = 'dorm-status-active';
            if (dormCheckOut) {
                dormStatusText = '❌ Не проживает';
                dormStatusClass = 'dorm-status-inactive';
            }

            var datesStr = genderWord + ' ' + formatDate(dormCheckIn);
            if (dormCheckOut) {
                datesStr += ' - ' + genderWordOut + ' ' + formatDate(dormCheckOut);
            }

            docHtml += '<div class="section-title">🏠 Общежитие</div>';
            docHtml += 
                '<div class="dormitory">' +
                    '<div class="dorm-row"><span class="dorm-label">Блок:</span> ' + dormBlock + '</div>' +
                    '<div class="dorm-row"><span class="dorm-label">Период:</span> ' + datesStr + '</div>' +
                    '<div class="dorm-row"><span class="dorm-label">Статус:</span> <span class="' + dormStatusClass + '">' + dormStatusText + '</span></div>' +
                '</div>';
        }

        var type = s.type || '';
        var maxCourse = getMaxCourse(type);
        if (hasCourseGrades(s, maxCourse)) {
            docHtml += '<div class="section-title">📊 Средний балл по курсам</div>';
            var courses = [{ num: 1, label: '1 курс' }, { num: 2, label: '2 курс' }, { num: 3, label: '3 курс' }];
            if (type === 'sso') courses.push({ num: 4, label: '4 курс' });
            courses.forEach(function(course) {
                var sem1 = s['grade_' + course.num + '_sem1'];
                var sem2 = s['grade_' + course.num + '_sem2'];
                var year = s['grade_' + course.num + '_year'];
                if (sem1 || sem2 || year) {
                    docHtml += 
                        '<div class="grade-section">' +
                            '<div class="grade-title">📘 ' + course.label + '</div>' +
                            (sem1 ? '<div class="grade-row"><span class="grade-label">1-ое полугодие:</span> <span class="grade-value">' + formatGrade(sem1) + '</span></div>' : '') +
                            (sem2 ? '<div class="grade-row"><span class="grade-label">2-ое полугодие:</span> <span class="grade-value">' + formatGrade(sem2) + '</span></div>' : '') +
                            (year ? '<div class="grade-row"><span class="grade-label">За год:</span> <span class="grade-value"><strong>' + formatGrade(year) + '</strong></span></div>' : '') +
                        '</div>';
                }
            });
        }

        if (currentParents && currentParents.length > 0) {
            docHtml += '<div class="section-title">👨‍👩‍👦 Родители</div>';
            currentParents.forEach(function(p) {
                docHtml += 
                    '<div class="related">' +
                        '<div class="related-name">' + p.full_name + '</div>' +
                        '<div class="related-info">' +
                            (p.relation || 'Родитель') + (p.birth_date ? ' • ' + formatDate(p.birth_date) + ' (' + calculateAge(p.birth_date) + ' лет)' : '') + (p.marital_status ? ' • ' + p.marital_status : '') +
                            (p.work_place ? '<br>🏢 ' + p.work_place + (p.position ? ' — ' + p.position : '') : '') +
                            (p.phone ? '<br>📱 ' + p.phone : '') +
                            (p.address ? '<br>📍 ' + p.address : '') +
                        '</div>' +
                    '</div>';
            });
        }

        if (currentSiblings && currentSiblings.length > 0) {
            docHtml += '<div class="section-title">👨‍👧‍👦 Братья и сёстры</div>';
            currentSiblings.forEach(function(sib) {
                docHtml += 
                    '<div class="related">' +
                        '<div class="related-name">' + sib.full_name + '</div>' +
                        '<div class="related-info">' +
                            (sib.type || 'Брат/сестра') + (sib.birth_date ? ' • ' + formatDate(sib.birth_date) + ' (' + calculateAge(sib.birth_date) + ' лет)' : '') + (sib.study_work ? ' • ' + sib.study_work : '') +
                        '</div>' +
                    '</div>';
            });
        }

        docHtml += 
                '<div class="footer">' +
                    'Дата: ' + dateStr + ' | Экспортировал(а): ' + userName +
                '</div>' +
            '</body>' +
            '</html>';

        var blob = new Blob([docHtml], { type: 'application/msword;charset=utf-8' });
        var filename = 'Карточка_учащегося_' + s.full_name.replace(/\s/g, '_') + '_' + dateStr.replace(/\./g, '-') + '.doc';
        saveAs(blob, filename);
        showToast('✅ Карточка сохранена в DOC');
    };
}

// ============================================================
// РЕДАКТИРОВАНИЕ СТУДЕНТА
// ============================================================

function bindEditButton() {
    document.getElementById('editStudentBtn').onclick = function() {
        if (!canUpdate) {
            showToast('❌ У вас нет прав на редактирование', 'error');
            return;
        }
        if (!canManageGroup(studentGroupId)) {
            showToast('❌ Вы не можете редактировать эту группу', 'error');
            return;
        }
        window.location.href = '/students/edit-student.html?id=' + studentId;
    };
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================

function bindBackButton() {
    document.getElementById('backBtn').onclick = async function() {
        if (!studentId) { window.location.href = '/students/index.html'; return; }
        var result = await sb
            .from('students')
            .select('group_id')
            .eq('id', studentId)
            .single();

        if (result.data && result.data.group_id) {
            window.location.href = '/students/group.html?id=' + result.data.group_id;
        } else {
            window.location.href = '/students/index.html';
        }
    };
}

function bindModalHandlers() {
    document.getElementById('modalCloseBtn').onclick = closeModal;
    document.getElementById('modalCancelBtn').onclick = closeModal;
    document.getElementById('actionModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================

async function init() {
    if (window.Session && typeof window.Session.init === 'function') {
        try {
            var sessionOk = await window.Session.init();
            if (sessionOk === false) return;
        } catch (e) {
            console.warn('⚠️ Session.init() ошибка:', e);
        }
    }

    sb = getSupabaseClient();
    if (!sb) {
        console.error('❌ Не удалось получить клиент Supabase');
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    waitForHeaderAndSidebar(function() {
        bindHeaderButtons();
        
        loadUser().then(function() {
            bindModalHandlers();
            bindBackButton();
            bindEditButton();
            bindExpelButton();
            bindAcademicButton();
            bindRestoreButton();
            bindDeleteButton();
            bindExportPDF();
            bindExportDOC();
            loadStudent();
        });
    });
}

function boot() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
}

boot();
</script>
