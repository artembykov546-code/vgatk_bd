    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1E3A8A; --primary-light: #3B82F6; --secondary: #2563EB;
            --success: #10B981; --success-dark: #059669; --warning: #F59E0B; --warning-dark: #D97706;

        .college-name { font-family: 'Lobster', cursive; font-size: 14px; color: var(--primary); line-height: 1.2; }
        .college-name .sub { font-family: 'Lobster', cursive; font-size: 14px; color: var(--primary); }
        .header-user { display: flex; align-items: center; gap: 12px; }
        .header-user-info { text-align: right; }
        .header-user-name { font-weight: 600; font-size: 13px; }
        .header-user-role { font-size: 11px; color: var(--text-muted); }
        .btn-logout { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); color: white; border: none; padding: 6px 14px; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition); }
        .btn-logout:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3); }

        .sidebar { position: fixed; left: 0; top: var(--header-height); width: var(--sidebar-width); height: calc(100vh - var(--header-height)); background: var(--bg-card); backdrop-filter: blur(12px); padding: 16px 0; overflow-y: auto; z-index: 90; border-right: 1px solid var(--border); }
        .sidebar-nav { list-style: none; padding: 0 12px; }
        .sidebar-nav li { margin-bottom: 2px; }
        .sidebar-nav .nav-label { padding: 10px 14px 4px; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: var(--border-radius); color: var(--text-secondary); font-weight: 500; font-size: 13px; transition: var(--transition); text-decoration: none; }
        .sidebar-nav a:hover { background: rgba(59, 130, 246, 0.08); color: var(--primary-light); }
        .sidebar-nav a.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }

        .btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border: none; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition); }

            .invite-grid { grid-template-columns: 1fr; }

// ============================================================
// ID УСТРОЙСТВА
// ============================================================
function getDeviceSessionId() {
    let sessionId = localStorage.getItem('deviceSessionId');
    if (!sessionId) {
        const ua = navigator.userAgent || '';
        const screen = window.screen.width + 'x' + window.screen.height;
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(2, 8);
        const base = btoa(ua.substring(0, 50) + screen).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20);
        sessionId = 'device_' + base + '_' + timestamp + '_' + random;
        localStorage.setItem('deviceSessionId', sessionId);
    }
    return sessionId;
}
var deviceSessionId = getDeviceSessionId();

// ============================================================
// ЗАВЕРШЕНИЕ СЕССИИ
// ============================================================
async function invalidateUserSession(userId) {
    try {
        var result = await supabaseClient
            .from('users')
            .update({ active_session_id: null })
            .eq('id', userId);
        if (result.error) throw result.error;
        return true;
    } catch (error) {
        console.error('❌ Ошибка завершения сессии:', error);
        return false;
    }
}

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
function loadUser() {
    const savedUser = localStorage.getItem('currentUser');
    if (!savedUser) { 
        window.location.href = '/index.html'; 
        return; 
    }
    try {
        currentUser = JSON.parse(savedUser);
        document.getElementById('userNameDisplay').textContent = currentUser.full_name || currentUser.name || currentUser.login;
        const roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'viewer': 'Наблюдатель' };
        document.getElementById('userRoleDisplay').textContent = roleMap[currentUser.role] || currentUser.role;
        
        canManage = ['super_admin', 'admin'].includes(currentUser.role);
        
        if (!canManage) {
            isAccessDenied = true;
            showAccessDenied();
            return;
        }
        
        // Если права есть — загружаем содержимое
        isAccessDenied = false;
        renderMainContent();
        loadInvites();
        
    } catch(e) {
        console.error('Ошибка загрузки пользователя:', e);
        localStorage.removeItem('currentUser');
        window.location.href = '/index.html';
    }
}

// ============================================================
// РЕНДЕР ОСНОВНОГО СОДЕРЖИМОГО
// ============================================================
function renderMainContent() {
    const container = document.getElementById('pageContainer');
    container.innerHTML = `
        <div class="page-header">
            <div>

            <button class="btn" data-filter="used">✅ Использованы</button>

            this.classList.add('active');

    // Назначаем обработчик для кнопки создания кода
    document.getElementById('generateInviteBtn').onclick = generateInvite;

    container.innerHTML = `

// ============================================================
// ЗАГРУЗКА ПРИГЛАШЕНИЙ
// ============================================================
async function loadInvites() {
    try {
        var result = await supabaseClient
            .from('users')
            .select(`
                id,
                login,
                role,
                invite_code,
                invite_used,
                invite_status,
                employee_id,
                employees!inner(full_name, position, category)
            `)
            .not('invite_code', 'is', null)
            .order('created_at', { ascending: false });

        if (result.error) throw result.error;

        invites = (result.data || []).map(function(item) {
            return {
                id: item.id,
                login: item.login,
                role: item.role,
                invite_code: item.invite_code,
                invite_used: item.invite_used,
                invite_status: item.invite_status,
                employee_id: item.employee_id,
                full_name: item.employees?.full_name || 'Без имени',
                position: item.employees?.position || '—',
                category: item.employees?.category || 'other',
                is_registered: !!item.login && item.invite_used === true
            };
        });

        renderInvites();
    } catch(error) {
        console.error('Ошибка загрузки:', error);
        const container = document.getElementById('inviteContainer');
        if (container) {
            container.innerHTML = '<div class="empty-state"><span class="icon">❌</span><p>Ошибка загрузки: ' + error.message + '</p></div>';
        }
    }
}

// ============================================================
// РЕНДЕРИНГ
// ============================================================
function renderInvites() {
    var container = document.getElementById('inviteContainer');
    if (!container) return;
    
    var filtered = invites;

    if (currentFilter === 'pending') {
        filtered = invites.filter(function(i) { return !i.invite_used && i.invite_status !== 'expired' && !i.is_registered; });
    } else if (currentFilter === 'used') {
        filtered = invites.filter(function(i) { return i.invite_used || i.invite_status === 'expired'; });
    } else if (currentFilter === 'registered') {
        filtered = invites.filter(function(i) { return i.is_registered; });
    }

    if (!filtered.length) {
        container.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>Нет пригласительных кодов</p></div>';
        return;
    }

    var roleLabels = {
        'super_admin': 'Супер-Админ',
        'admin': 'Администратор',
        'teacher': 'Преподаватель',
        'master': 'Мастер ПО',
        'viewer': 'Наблюдатель'
    };
    var roleBadgeClasses = {
        'super_admin': 'badge-super_admin',
        'admin': 'badge-admin',
        'teacher': 'badge-teacher',
        'master': 'badge-master',
        'viewer': 'badge-viewer'
    };
    var categoryLabels = {
        'teachers': 'Преподаватель',
        'masters': 'Мастер ПО',
        'administration': 'Администрация',
        'other': 'Другие'
    };

    var html = '<div class="invite-grid">';
    filtered.forEach(function(invite) {
        var isRegistered = invite.is_registered;
        var isUsed = invite.invite_used || invite.invite_status === 'expired';
        
        var statusClass = 'pending';
        var statusLabel = '⏳ Ожидает';
        
        if (isRegistered) {
            statusClass = 'registered';
            statusLabel = '🔐 Зарегистрирован';
        } else if (isUsed) {
            statusClass = 'used';
            statusLabel = '✅ Использован';
        }
        
        var registrationUrl = window.location.origin + '/register/index.html?code=' + invite.invite_code;

        var codeHtml = '';
        var actionsHtml = '';
        
        if (isRegistered) {
            codeHtml = '<div style="background:#D1FAE5;padding:6px 12px;border-radius:var(--border-radius);text-align:center;margin:8px 0;border:2px solid var(--success);"><span style="color:var(--success-dark);font-weight:600;">✅ Пользователь уже зарегистрирован</span></div>';
            actionsHtml = `
                <div style="margin:4px 0;">
                    <span class="user-login">👤 ${invite.login}</span>
                </div>
                <button class="btn btn-danger btn-xs" onclick="resetUserCredentials('${invite.id}', '${invite.full_name}')">🔄 Сбросить доступ</button>
            `;
        } else {
            codeHtml = '<div class="code">' + invite.invite_code + '</div>';
            if (!isUsed) {
                actionsHtml = `
                    <button class="btn btn-info btn-xs" onclick="copyCode('${invite.invite_code}')">📋 Копировать</button>
                    <button class="btn btn-danger btn-xs" onclick="revokeInvite('${invite.id}')">🚫 Отозвать</button>
                `;
            } else {
                actionsHtml = `
                    <button class="btn btn-info btn-xs" onclick="copyCode('${invite.invite_code}')">📋 Копировать</button>
                    <span style="font-size:11px;color:var(--text-muted);">Код использован</span>
                `;
            }
        }

        html += '' +
            '<div class="invite-card">' +
            '<div class="name">' + invite.full_name + '</div>' +
            '<div class="position">' + invite.position + ' · ' + (categoryLabels[invite.category] || invite.category) + '</div>' +
            '<div style="margin:3px 0;">' +
            '<span class="badge-role ' + (roleBadgeClasses[invite.role] || 'badge-viewer') + '">' + (roleLabels[invite.role] || invite.role) + '</span>' +
            '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
            '</div>' +
            codeHtml +
            '<div style="font-size:11px;color:var(--text-muted);">' +
            '🔗 <a href="' + registrationUrl + '" target="_blank" class="registration-link">' + registrationUrl + '</a>' +
            '</div>' +
            '<div class="actions">' + actionsHtml + '</div>' +
            '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
}

// ============================================================
// КОПИРОВАНИЕ
// ============================================================
function copyCode(code) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function() {
            showToast('✅ Код скопирован!', 'success');
        }).catch(function() {
            showToast('❌ Не удалось скопировать', 'error');
        });
    } else {
        showToast('❌ Копирование не поддерживается', 'error');
    }
}

// ============================================================
// ОТЗЫВ КОДА
// ============================================================
async function revokeInvite(userId) {
    if (!confirm('Отозвать пригласительный код? Пользователь не сможет зарегистрироваться.')) return;
    try {
        var result = await supabaseClient
            .from('users')
            .update({ invite_status: 'expired' })
            .eq('id', userId);
        if (result.error) throw result.error;
        showToast('✅ Код отозван', 'success');
        loadInvites();
    } catch(error) {
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

// ============================================================
// СБРОС ДОСТУПА ДЛЯ ЗАРЕГИСТРИРОВАННОГО ПОЛЬЗОВАТЕЛЯ
// ============================================================
async function resetUserCredentials(userId, fullName) {
    if (!confirm('Сбросить доступ для ' + fullName + '?\n\nЭто действие:\n• Сгенерирует НОВЫЙ пригласительный код\n• Удалит текущий логин и пароль\n• Завершит все активные сессии\n• Потребует повторной регистрации')) return;
    
    try {
        var part1 = Math.floor(1000 + Math.random() * 9000).toString();
        var part2 = Math.floor(1000 + Math.random() * 9000).toString();
        var newInviteCode = part1 + '-' + part2;
        
        var result = await supabaseClient
            .from('users')
            .update({
                login: null,
                password_hash: null,
                invite_code: newInviteCode,
                invite_used: false,
                invite_status: 'pending',
                active_session_id: null
            })
            .eq('id', userId);
        
        if (result.error) throw result.error;
        
        showToast('✅ Доступ сброшен! Новый код: ' + newInviteCode, 'success');
        loadInvites();
        
    } catch(error) {
        console.error('Ошибка сброса:', error);
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

// ============================================================
// СОЗДАНИЕ НОВОГО КОДА
// ============================================================
async function generateInvite() {
    var btn = document.getElementById('generateInviteBtn');
    if (!btn) return;
    
    btn.innerHTML = '⏳ ...';
    btn.disabled = true;

    try {
        var empResult = await supabaseClient
            .from('employees')
            .select('id, full_name, position, category')
            .eq('is_hidden', false)
            .order('full_name');

        if (empResult.error) throw empResult.error;

        var usersResult = await supabaseClient
            .from('users')
            .select('employee_id, invite_code')
            .not('invite_code', 'is', null);

        var existingIds = new Set();
        (usersResult.data || []).forEach(function(u) {
            existingIds.add(u.employee_id);
        });

        var available = empResult.data.filter(function(e) {
            return !existingIds.has(e.id);
        });

        if (!available.length) {
            showToast('ℹ️ Нет сотрудников без приглашений', 'warning');
            btn.innerHTML = '➕ Создать код';
            btn.disabled = false;
            return;
        }

        var emp = available[0];
        var part1 = Math.floor(1000 + Math.random() * 9000).toString();
        var part2 = Math.floor(1000 + Math.random() * 9000).toString();
        var code = part1 + '-' + part2;

        var insertResult = await supabaseClient
            .from('users')
            .insert([{
                employee_id: emp.id,
                invite_code: code,
                invite_used: false,
                invite_status: 'pending',
                role: 'viewer'
            }]);

        if (insertResult.error) throw insertResult.error;

        showToast('✅ Код создан для ' + emp.full_name + ': ' + code, 'success');
        loadInvites();

    } catch(error) {
        showToast('❌ Ошибка: ' + error.message, 'error');
    } finally {
        btn.innerHTML = '➕ Создать код';
        btn.disabled = false;
    }
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

// ============================================================
// ПРОВЕРКА СЕССИИ
// ============================================================
async function checkSessionOnLoad() {
    // Если доступ запрещён — не проверяем сессию, чтобы не выкидывать пользователя
    if (isAccessDenied) {
        console.log('🔒 Доступ запрещён, проверка сессии пропущена');
        return;
    }
    
    var savedUser = localStorage.getItem('currentUser');
    if (!savedUser) return;
    try {
        var user = JSON.parse(savedUser);
        var result = await supabaseClient
            .from('users')
            .select('active_session_id')
            .eq('id', user.id)
            .single();
        if (result.error) return;
        if (result.data.active_session_id && result.data.active_session_id !== deviceSessionId) {
            localStorage.removeItem('currentUser');
            window.location.href = '/index.html';
        }
    } catch(error) {
        console.error('Ошибка проверки сессии:', error);
    }
}

// ============================================================
// ЗАПУСК
// ============================================================
console.log('🆔 ID устройства:', deviceSessionId);
loadUser();
setTimeout(checkSessionOnLoad, 500);
</script>
