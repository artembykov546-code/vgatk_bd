<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пригласительные коды | vgatk_bd</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1E3A8A; --primary-light: #3B82F6; --secondary: #2563EB;
            --success: #10B981; --success-dark: #059669; --warning: #F59E0B; --warning-dark: #D97706;
            --danger: #EF4444; --danger-dark: #DC2626;
            --bg-main: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 25%, #f0f9ff 50%, #fef3c7 75%, #fde68a 100%);
            --bg-card: rgba(255, 255, 255, 0.96);
            --text-primary: #1E293B; --text-secondary: #475569; --text-muted: #64748B;
            --border: #dbeafe; --border-radius: 8px; --border-radius-lg: 12px; --border-radius-xl: 16px;
            --shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
            --header-height: 74px; --sidebar-width: 220px; --transition: all 0.3s ease;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); background-attachment: fixed; min-height: 100vh; color: var(--text-primary); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header { background: var(--bg-card); backdrop-filter: blur(12px); padding: 12px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12); border-bottom: 1px solid var(--border); min-height: var(--header-height); }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .college-name { font-family: 'Lobster', cursive; font-size: 16px; color: var(--primary); line-height: 1.2; }
        .college-name .sub { font-family: 'Lobster', cursive; font-size: 16px; color: var(--primary); }
        .header-user { display: flex; align-items: center; gap: 16px; }
        .header-user-info { text-align: right; }
        .header-user-name { font-weight: 600; font-size: 14px; }
        .header-user-role { font-size: 12px; color: var(--text-muted); }
        .btn-logout { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); color: white; border: none; padding: 8px 16px; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 13px; transition: var(--transition); }
        .btn-logout:hover { transform: translateY(-2px); }

        .sidebar { position: fixed; left: 0; top: var(--header-height); width: var(--sidebar-width); height: calc(100vh - var(--header-height)); background: var(--bg-card); backdrop-filter: blur(12px); padding: 20px 0; overflow-y: auto; z-index: 90; border-right: 1px solid var(--border); }
        .sidebar-nav { list-style: none; padding: 0 16px; }
        .sidebar-nav li { margin-bottom: 4px; }
        .sidebar-nav .nav-label { padding: 12px 16px 6px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: var(--border-radius); color: var(--text-secondary); font-weight: 500; font-size: 14px; transition: var(--transition); text-decoration: none; }
        .sidebar-nav a:hover { background: rgba(59, 130, 246, 0.08); color: var(--primary-light); }
        .sidebar-nav a.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }
        .sidebar-nav a .icon { font-size: 20px; width: 24px; text-align: center; }

        .main-content { margin-left: var(--sidebar-width); padding: 24px 32px; min-height: calc(100vh - var(--header-height)); animation: fadeIn 0.6s ease; }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border: none; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 13px; transition: var(--transition); }
        .btn:hover { transform: translateY(-2px); }
        .btn-success { background: linear-gradient(135deg, var(--success), var(--success-dark)); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #94A3B8, #64748B); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), var(--warning-dark)); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); color: white; }
        .btn-info { background: linear-gradient(135deg, var(--primary-light), var(--secondary)); color: white; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-light), var(--secondary)); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 6px; }

        .page-container { max-width: 1200px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--primary); }
        .page-title small { font-weight: 400; font-size: 14px; color: var(--text-muted); }

        .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters .btn { background: var(--bg-card); border: 2px solid var(--border); color: var(--text-secondary); }
        .filters .btn.active { border-color: var(--primary); background: var(--bg-active); color: var(--primary); }

        .invite-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; }
        .invite-card { background: var(--bg-card); border-radius: var(--border-radius-lg); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: var(--transition); }
        .invite-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .invite-card .name { font-size: 18px; font-weight: 700; color: var(--primary); }
        .invite-card .position { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
        .invite-card .code { background: #FEF3C7; padding: 8px 16px; border-radius: var(--border-radius); font-family: monospace; font-size: 18px; font-weight: 700; color: var(--warning-dark); margin: 12px 0; border: 2px dashed var(--warning); text-align: center; letter-spacing: 2px; }
        .invite-card .status { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .invite-card .status.pending { background: #FEF3C7; color: #92400E; }
        .invite-card .status.used { background: #D1FAE5; color: #065F46; }
        .invite-card .status.expired { background: #FEE2E2; color: #991B1B; }
        .invite-card .registration-link { color: var(--primary-light); text-decoration: underline; word-break: break-all; font-size: 13px; }
        .invite-card .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

        .badge-role { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-super_admin { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
        .badge-admin { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
        .badge-teacher { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }
        .badge-master { background: #DBEAFE; color: #1A5276; border: 1px solid #3B82F6; }
        .badge-viewer { background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1; }

        .toast-notification {
            position: fixed; top: 80px; right: 20px; padding: 16px 24px;
            border-radius: var(--border-radius); color: white; font-weight: 600;
            z-index: 9999; animation: slideUp 0.3s ease; max-width: 400px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-notification .toast-close { float: right; margin-left: 16px; cursor: pointer; font-size: 18px; opacity: 0.8; }
        .toast-notification .toast-close:hover { opacity: 1; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }

        .print-btn { background: linear-gradient(135deg, #4B5563, #1F2937); color: white; }
        .print-btn:hover { background: linear-gradient(135deg, #1F2937, #111827); }

        @media (max-width: 768px) {
            .header { padding: 10px 16px; }
            .header-user-info { display: none; }
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .invite-grid { grid-template-columns: 1fr; }
            .filters { flex-wrap: wrap; }
            .toast-notification { left: 20px; right: 20px; top: 80px; }
        }
        @media print {
            .header, .sidebar, .btn, .filters, .actions { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 20px !important; }
            .invite-card { break-inside: avoid; border: 1px solid #ddd; box-shadow: none; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-logo">
        <span class="college-name">
            Учреждение образования<br>
            <span class="sub">"Витебский государственный аграрно-технический колледж"</span>
        </span>
    </div>
    <div class="header-user">
        <div class="header-user-info">
            <div class="header-user-name" id="userNameDisplay">Загрузка...</div>
            <div class="header-user-role" id="userRoleDisplay">Загрузка...</div>
        </div>
        <button class="btn-logout" id="logoutBtn">🚪 Выйти</button>
    </div>
</header>

<aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
        <li class="nav-label">Главное</li>
        <li><a href="/dashboard.html"><span class="icon">🏠</span> Главная</a></li>
        <li><a href="/employees/index.html"><span class="icon">👨‍🏫</span> Сотрудники</a></li>
        <li><a href="/students/index.html"><span class="icon">👨‍🎓</span> Учащиеся</a></li>
        <li><a href="/graduates/index.html"><span class="icon">🎓</span> Выпускники</a></li>
        <li><a href="/reports/index.html"><span class="icon">📊</span> Отчёты</a></li>
        <li class="nav-label" style="margin-top:12px;">Система</li>
        <li><a href="/invites/index.html" class="active"><span class="icon">📨</span> Приглашения</a></li>
        <li><a href="/profile/index.html"><span class="icon">⚙️</span> Профиль</a></li>
    </ul>
</aside>

<main class="main-content">
    <button class="btn btn-secondary btn-sm" id="menuToggle" style="margin-bottom:16px;display:none;">☰ Меню</button>

    <div class="page-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">📨 Пригласительные коды <small>управление доступом</small></h1>
            </div>
            <div>
                <button class="btn btn-secondary print-btn" onclick="window.print()">🖨️ Распечатать</button>
                <button class="btn btn-success" id="generateInviteBtn" style="display:none;">➕ Создать код</button>
            </div>
        </div>

        <div class="filters" id="filterContainer">
            <button class="btn active" data-filter="all">Все</button>
            <button class="btn" data-filter="pending">⏳ Ожидают</button>
            <button class="btn" data-filter="used">✅ Использованы</button>
        </div>

        <div id="inviteContainer">
            <div class="empty-state"><span class="icon">⏳</span><p>Загрузка...</p></div>
        </div>
    </div>
</main>

<script>
const SUPABASE_URL = 'https://selbolepupendprhixas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbGJvbGVwdXBlbmRwcmhpeGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjQzODgsImV4cCI6MjA5ODE0MDM4OH0.UpWEr6hEs9ytnDxnaQ7Uf3d_xDQLHO-eejkIw53o7EE';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let invites = [];
let currentFilter = 'all';
let canManage = false;

function loadUser() {
    const savedUser = localStorage.getItem('currentUser');
    if (!savedUser) { window.location.href = '/index.html'; return; }
    try {
        currentUser = JSON.parse(savedUser);
        document.getElementById('userNameDisplay').textContent = currentUser.full_name || currentUser.name || currentUser.login;
        const roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'viewer': 'Наблюдатель' };
        document.getElementById('userRoleDisplay').textContent = roleMap[currentUser.role] || currentUser.role;
        
        canManage = ['super_admin', 'admin'].includes(currentUser.role);
        document.getElementById('generateInviteBtn').style.display = canManage ? 'inline-flex' : 'none';
        
        if (!canManage) {
            document.getElementById('filterContainer').style.display = 'none';
        }
        
        loadInvites();
    } catch(e) {
        localStorage.removeItem('currentUser');
        window.location.href = '/index.html';
    }
}

document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('currentUser');
    window.location.href = '/index.html';
};
document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
if (window.innerWidth <= 768) document.getElementById('menuToggle').style.display = 'inline-block';

async function loadInvites() {
    try {
        const { data, error } = await supabaseClient
            .from('users')
            .select(`
                id,
                login,
                role,
                invite_code,
                invite_used,
                invite_status,
                employee_id,
                employees!inner(full_name, position, category)
            `)
            .not('invite_code', 'is', null)
            .order('created_at', { ascending: false });

        if (error) throw error;

        invites = (data || []).map(item => ({
            ...item,
            full_name: item.employees?.full_name || 'Без имени',
            position: item.employees?.position || '—',
            category: item.employees?.category || 'other'
        }));

        renderInvites();
    } catch(error) {
        console.error('Ошибка загрузки:', error);
        document.getElementById('inviteContainer').innerHTML = `<div class="empty-state"><span class="icon">❌</span><p>Ошибка загрузки: ${error.message}</p></div>`;
    }
}

function renderInvites() {
    const container = document.getElementById('inviteContainer');
    let filtered = invites;

    if (currentFilter === 'pending') {
        filtered = invites.filter(i => !i.invite_used && i.invite_status !== 'expired');
    } else if (currentFilter === 'used') {
        filtered = invites.filter(i => i.invite_used || i.invite_status === 'expired');
    }

    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state"><span class="icon">📭</span><p>Нет пригласительных кодов</p></div>`;
        return;
    }

    const roleLabels = {
        'super_admin': 'Супер-Админ',
        'admin': 'Администратор',
        'teacher': 'Преподаватель',
        'master': 'Мастер ПО',
        'viewer': 'Наблюдатель'
    };
    const roleBadgeClasses = {
        'super_admin': 'badge-super_admin',
        'admin': 'badge-admin',
        'teacher': 'badge-teacher',
        'master': 'badge-master',
        'viewer': 'badge-viewer'
    };
    const categoryLabels = {
        'teachers': 'Преподаватель',
        'masters': 'Мастер ПО',
        'administration': 'Администрация',
        'other': 'Другие'
    };

    let html = '<div class="invite-grid">';
    filtered.forEach(invite => {
        const isUsed = invite.invite_used || invite.invite_status === 'expired';
        const statusClass = isUsed ? 'used' : 'pending';
        const statusLabel = isUsed ? '✅ Использован' : '⏳ Ожидает';
        const registrationUrl = `${window.location.origin}/register/index.html?code=${invite.invite_code}`;

        html += `
            <div class="invite-card">
                <div class="name">${invite.full_name}</div>
                <div class="position">${invite.position} · ${categoryLabels[invite.category] || invite.category}</div>
                <div style="margin:4px 0;">
                    <span class="badge-role ${roleBadgeClasses[invite.role] || 'badge-viewer'}">${roleLabels[invite.role] || invite.role}</span>
                    <span class="status ${statusClass}">${statusLabel}</span>
                </div>
                <div class="code">${invite.invite_code}</div>
                <div style="font-size:12px;color:var(--text-muted);">
                    🔗 <a href="${registrationUrl}" target="_blank" class="registration-link">${registrationUrl}</a>
                </div>
                ${canManage ? `
                    <div class="actions">
                        <button class="btn btn-info btn-xs" onclick="copyCode('${invite.invite_code}')">📋 Копировать</button>
                        ${!isUsed ? `<button class="btn btn-danger btn-xs" onclick="revokeInvite('${invite.id}')">🚫 Отозвать</button>` : ''}
                    </div>
                ` : ''}
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

function copyCode(code) {
    navigator.clipboard.writeText(code).then(() => {
        showToast('✅ Код скопирован!', 'success');
    }).catch(() => {
        showToast('❌ Не удалось скопировать', 'error');
    });
}

async function revokeInvite(userId) {
    if (!confirm('Отозвать пригласительный код? Пользователь не сможет зарегистрироваться.')) return;
    try {
        const { error } = await supabaseClient
            .from('users')
            .update({ invite_status: 'expired' })
            .eq('id', userId);
        if (error) throw error;
        showToast('✅ Код отозван', 'success');
        loadInvites();
    } catch(error) {
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

document.getElementById('generateInviteBtn').onclick = async function() {
    const btn = this;
    btn.innerHTML = '⏳ ...';
    btn.disabled = true;

    try {
        // Получаем список сотрудников без приглашений
        const { data: employees, error: empError } = await supabaseClient
            .from('employees')
            .select('id, full_name, position, category')
            .eq('is_hidden', false)
            .order('full_name');

        if (empError) throw empError;

        // Фильтруем тех, у кого нет пользователя или нет инвайта
        const { data: existingUsers } = await supabaseClient
            .from('users')
            .select('employee_id, invite_code')
            .not('invite_code', 'is', null);

        const existingIds = new Set((existingUsers || []).map(u => u.employee_id));
        const available = employees.filter(e => !existingIds.has(e.id));

        if (!available.length) {
            showToast('ℹ️ Нет сотрудников без приглашений', 'warning');
            btn.innerHTML = '➕ Создать код';
            btn.disabled = false;
            return;
        }

        // Выбираем первого
        const emp = available[0];
        const part1 = Math.floor(1000 + Math.random() * 9000).toString();
        const part2 = Math.floor(1000 + Math.random() * 9000).toString();
        const code = `${part1}-${part2}`;

        const { error } = await supabaseClient
            .from('users')
            .insert([{
                employee_id: emp.id,
                invite_code: code,
                invite_used: false,
                invite_status: 'pending',
                role: 'viewer'
            }]);

        if (error) throw error;

        showToast(`✅ Код создан для ${emp.full_name}: ${code}`, 'success');
        loadInvites();

    } catch(error) {
        showToast('❌ Ошибка: ' + error.message, 'error');
    } finally {
        btn.innerHTML = '➕ Создать код';
        btn.disabled = false;
    }
};

document.querySelectorAll('.filters .btn').forEach(btn => {
    btn.onclick = function() {
        document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderInvites();
    };
});

function showToast(message, type = 'success') {
    const existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast-notification toast-${type}`;
    toast.innerHTML = `<span class="toast-close" onclick="this.parentElement.remove()">×</span>${message}`;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
}

loadUser();
</script>
</body>
</html>
