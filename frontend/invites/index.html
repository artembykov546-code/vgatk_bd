<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пригласительные коды | vgatk_bd</title>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/components.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>

    <!-- html2pdf для экспорта -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .page-container { max-width: 1100px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .page-title { font-size: 20px; font-weight: 700; color: var(--primary); }
        .page-title small { font-weight: 400; font-size: 13px; color: var(--text-muted); }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters .btn { background: var(--bg-card); border: 2px solid var(--border); color: var(--text-secondary); font-size: 12px; padding: 4px 14px; cursor: pointer; }
        .filters .btn.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.08); color: var(--primary); }

        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 10px 16px; border: 2px solid var(--border); border-radius: var(--border-radius); font-size: 14px; background: rgba(255, 255, 255, 0.95); }
        .search-bar input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .search-bar .btn { white-space: nowrap; }

        .invite-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
        .invite-card { background: var(--bg-card); border-radius: var(--border-radius-lg); padding: 14px 16px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: var(--transition); }
        .invite-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12); }
        .invite-card .name { font-size: 15px; font-weight: 700; color: var(--primary); }
        .invite-card .position { color: var(--text-secondary); font-size: 13px; margin-top: 2px; font-weight: 500; }
        .invite-card .category { color: var(--text-muted); font-size: 12px; margin-top: 1px; }
        .invite-card .code { background: #FEF3C7; padding: 6px 12px; border-radius: var(--border-radius); font-family: monospace; font-size: 15px; font-weight: 700; color: var(--warning-dark); margin: 8px 0; border: 2px dashed var(--warning); text-align: center; letter-spacing: 1px; }
        .invite-card .status { display: inline-block; padding: 1px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .invite-card .status.pending { background: #FEF3C7; color: #92400E; }
        .invite-card .status.used { background: #D1FAE5; color: #065F46; }
        .invite-card .status.expired { background: #FEE2E2; color: #991B1B; }
        .invite-card .status.registered { background: #DBEAFE; color: #1A5276; }
        .invite-card .registration-link { color: var(--primary-light); text-decoration: underline; word-break: break-all; font-size: 12px; }
        .invite-card .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .invite-card .user-login { font-size: 12px; color: var(--success-dark); font-weight: 600; background: #D1FAE5; padding: 1px 8px; border-radius: 4px; display: inline-block; }

        .badge-role { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
        .badge-super_admin { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
        .badge-admin { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
        .badge-teacher { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }
        .badge-master { background: #DBEAFE; color: #1A5276; border: 1px solid #3B82F6; }
        .badge-viewer { background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1; }

        .toast-notification { position: fixed; top: 80px; right: 20px; padding: 12px 20px; border-radius: var(--border-radius); color: white; font-weight: 600; z-index: 9999; animation: slideUp 0.3s ease; max-width: 380px; box-shadow: 0 16px 48px rgba(37, 99, 235, 0.15); font-size: 13px; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-notification .toast-close { float: right; margin-left: 12px; cursor: pointer; font-size: 16px; opacity: 0.8; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 40px; display: block; margin-bottom: 8px; }

        .btn-export-pdf { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: white; }
        .btn-export-pdf:hover { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); }

        .access-denied { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 40px 20px; }
        .access-denied .lock-image { width: 200px; height: 200px; object-fit: contain; display: block; margin-bottom: 16px; animation: fadeIn 0.6s ease; }
        .access-denied .denied-title { font-size: 36px; font-weight: 800; color: var(--danger); margin-bottom: 8px; letter-spacing: 1px; }
        .access-denied .denied-subtitle { font-size: 18px; color: var(--text-secondary); margin-bottom: 6px; }
        .access-denied .denied-desc { font-size: 14px; color: var(--text-muted); max-width: 500px; margin-bottom: 24px; }
        .access-denied .btn-back { background: linear-gradient(135deg, var(--primary-light), var(--secondary)); color: white; padding: 10px 32px; border: none; border-radius: var(--border-radius); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .access-denied .btn-back:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3); }

        /* ===== СТИЛИ ДЛЯ PDF (Альбомная ориентация) ===== */
        .pdf-content {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            padding: 10px;
            background: white;
            color: #000;
            width: 100%;
        }
        .pdf-content .pdf-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000;
        }
        .pdf-content .pdf-header .pdf-title {
            font-size: 20pt;
            font-weight: 700;
            text-transform: uppercase;
        }
        .pdf-content .pdf-header .pdf-subtitle {
            font-size: 12pt;
            margin-top: 6px;
            color: #444;
        }

        /* Сетка для альбомной ориентации (3 колонки) */
        .pdf-cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .pdf-cut-card {
            border: 2px dashed #333;
            border-radius: 6px;
            padding: 12px;
            page-break-inside: avoid; /* Запрет разрыва блока */
            break-inside: avoid;
            background: #fff;
        }

        .pdf-cut-card .pdf-card-name {
            font-size: 12pt;
            font-weight: 700;
            margin-bottom: 2px;
            color: #000;
        }
        .pdf-cut-card .pdf-card-pos {
            font-size: 10pt;
            color: #555;
            margin-bottom: 8px;
        }
        .pdf-cut-card .pdf-card-code {
            font-family: 'Courier New', monospace;
            font-size: 16pt;
            font-weight: 700;
            text-align: center;
            background: #FFF8E1;
            border: 1px solid #000;
            padding: 8px;
            letter-spacing: 2px;
            margin: 8px 0;
        }
        .pdf-cut-card .pdf-card-url {
            font-size: 8pt;
            color: #333;
            word-break: break-all;
            text-align: center;
        }
        .pdf-cut-card .pdf-card-role {
            font-size: 9pt;
            color: #444;
            text-align: center;
            margin-top: 6px;
            font-style: italic;
        }

        @media print {
            .header, .sidebar, .btn, .filters, .actions, .search-bar { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 16px !important; }
            .invite-card { break-inside: avoid; border: 1px solid #ddd; box-shadow: none; }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1E3A8A">
</head>
<body>

<header class="header"></header>
<aside class="sidebar" id="sidebar"></aside>

<main class="main-content">
    <div class="page-container" id="pageContainer"></div>
</main>

<script>
if (typeof dcodeIO !== 'undefined' && dcodeIO.bcrypt) { window.bcrypt = dcodeIO.bcrypt; }

var sb = null;
var currentUser = null;
var invites = [];
var currentFilter = 'all';
var searchQuery = '';
var canManage = false;

var categoryLabels = { 'teachers': 'Преподаватель', 'masters': 'Мастер ПО', 'administration': 'Администрация', 'other': 'Другие' };

// ФИО создателя БД, которого скрываем из списка
var HIDDEN_NAMES = ['Быков Артём', 'Быков Артем', 'Сотрудник'];

function isHiddenCreator(fullName) {
    if (!fullName) return false;
    return HIDDEN_NAMES.some(function(name) { return fullName.indexOf(name) !== -1; });
}

function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) { callback(); return; }
    if (attempts > 100) { callback(); return; }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

function getSupabaseClient() {
    if (window.Session && typeof window.Session.supabase === 'function') {
        var client = window.Session.supabase();
        if (client) return client;
    }
    if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) return window.supabaseClient;
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        var client = window.supabase.createClient(
            'https://selbolepupendprhixas.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbGJvbGVwdXBlbmRwcmhpeGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjQzODgsImV4cCI6MjA5ODE0MDM4OH0.UpWEr6hEs9ytnDxnaQ7Uf3d_xDQLHO-eejkIw53o7EE'
        );
        window.supabaseClient = client;
        return client;
    }
    return null;
}

async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) { window.location.href = '/index.html'; return false; }
        try { user = JSON.parse(savedUser); } catch (e) { localStorage.removeItem('currentUser'); window.location.href = '/index.html'; return false; }
    }
    currentUser = user;

    waitForHeaderAndSidebar(function() {
        var nameEl = document.getElementById('userNameDisplay');
        var roleEl = document.getElementById('userRoleDisplay');
        if (nameEl) nameEl.textContent = user.full_name || user.name || user.login;
        var roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
        if (roleEl) roleEl.textContent = roleMap[user.role] || user.role;
    });

    canManage = user.role === 'super_admin' || user.role === 'admin';

    if (!canManage) {
        showAccessDenied();
        return false;
    }

    renderMainContent();
    await loadInvites();
    return true;
}

function bindHeaderButtons() {
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn && !logoutBtn.__bound) {
        logoutBtn.__bound = true;
        logoutBtn.onclick = function() {
            if (window.Session && typeof window.Session.logout === 'function') { window.Session.logout(); }
            else { localStorage.removeItem('currentUser'); window.location.href = '/index.html'; }
        };
    }
    var menuToggle = document.getElementById('menuToggle');
    if (menuToggle && !menuToggle.__bound) {
        menuToggle.__bound = true;
        menuToggle.onclick = function() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        };
        if (window.innerWidth > 768) { menuToggle.style.display = 'none'; } else { menuToggle.style.display = 'inline-block'; }
    }
}

function renderMainContent() {
    var container = document.getElementById('pageContainer');
    container.innerHTML =
        '<div class="page-header">' +
            '<div><h1 class="page-title">📨 Пригласительные коды <small>управление доступом</small></h1></div>' +
            '<div class="header-actions">' +
                '<button class="btn btn-export-pdf" id="exportPdfBtn">📄 Экспорт в PDF</button>' +
            '</div>' +
        '</div>' +
        '<div class="filters" id="filterContainer">' +
            '<button class="btn active" data-filter="all">Все</button>' +
            '<button class="btn" data-filter="pending">⏳ Ожидают</button>' +
            '<button class="btn" data-filter="registered">🔐 Зарегистрированы</button>' +
        '</div>' +
        '<div class="search-bar">' +
            '<input type="text" id="searchInput" placeholder="🔍 Поиск по ФИО..." autocomplete="off">' +
            '<button class="btn btn-secondary" id="clearSearchBtn">Сбросить</button>' +
        '</div>' +
        '<div id="inviteContainer"><div class="empty-state"><span class="icon">⏳</span><p>Загрузка...</p></div></div>';

    document.querySelectorAll('.filters .btn').forEach(function(btn) {
        btn.onclick = function() {
            document.querySelectorAll('.filters .btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderInvites();
        };
    });

    document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value.trim().toLowerCase();
        renderInvites();
    });

    document.getElementById('clearSearchBtn').onclick = function() {
        document.getElementById('searchInput').value = '';
        searchQuery = '';
        renderInvites();
    };

    document.getElementById('exportPdfBtn').onclick = exportToPDF;
}

function showAccessDenied() {
    var container = document.getElementById('pageContainer');
    container.innerHTML =
        '<div class="access-denied">' +
            '<img src="/images/other/forbidden.gif" alt="Доступ запрещён" class="lock-image" onerror="this.style.display=\'none\';this.parentElement.querySelector(\'.lock-fallback\').style.display=\'block\'">' +
            '<div class="lock-fallback" style="display:none;font-size:120px;margin-bottom:16px;">🔒</div>' +
            '<h1 class="denied-title">Доступ запрещён</h1>' +
            '<p class="denied-subtitle">У вас недостаточно прав для просмотра этой страницы</p>' +
            '<p class="denied-desc">Только пользователи с правами <strong>Администратора</strong> или <strong>Супер-Администратора</strong> имеют доступ к управлению пригласительными кодами.</p>' +
            '<button class="btn-back" onclick="window.location.href=\'/dashboard.html\'">🏠 Вернуться на главную</button>' +
        '</div>';
}

async function loadInvites() {
    if (!sb) {
        var container = document.getElementById('inviteContainer');
        if (container) container.innerHTML = '<div class="empty-state"><span class="icon">❌</span><p>Ошибка подключения к базе данных</p></div>';
        return;
    }
    try {
        var result = await sb
            .from('users')
            .select('id, login, role, invite_code, invite_used, invite_status, employee_id, employees!inner (full_name, position, category)')
            .not('invite_code', 'is', null)
            .order('created_at', { ascending: false });

        if (result.error) throw result.error;

        invites = (result.data || []).map(function(item) {
            return {
                id: item.id,
                login: item.login,
                role: item.role,
                invite_code: item.invite_code,
                invite_used: item.invite_used,
                invite_status: item.invite_status,
                employee_id: item.employee_id,
                full_name: item.employees ? item.employees.full_name : 'Без имени',
                position: item.employees ? item.employees.position : '—',
                category: item.employees ? item.employees.category : 'other',
                is_registered: !!item.login && item.invite_used === true
            };
        }).filter(function(i) {
            return !isHiddenCreator(i.full_name);
        });

        invites.sort(function(a, b) { return (a.full_name || '').localeCompare(b.full_name || '', 'ru'); });
        renderInvites();
    } catch (error) {
        var container2 = document.getElementById('inviteContainer');
        if (container2) container2.innerHTML = '<div class="empty-state"><span class="icon">❌</span><p>Ошибка загрузки: ' + error.message + '</p></div>';
    }
}

function getFilteredInvites() {
    var filtered = invites;

    if (currentFilter === 'pending') {
        filtered = filtered.filter(function(i) { return !i.invite_used && i.invite_status !== 'expired' && !i.is_registered; });
    } else if (currentFilter === 'registered') {
        filtered = filtered.filter(function(i) { return i.is_registered; });
    }

    if (searchQuery) {
        filtered = filtered.filter(function(i) {
            return (i.full_name || '').toLowerCase().indexOf(searchQuery) !== -1;
        });
    }

    return filtered;
}

function renderInvites() {
    var container = document.getElementById('inviteContainer');
    if (!container) return;

    var filtered = getFilteredInvites();

    if (!filtered.length) {
        container.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>' + (searchQuery ? 'Ничего не найдено' : 'Нет пригласительных кодов') + '</p></div>';
        return;
    }

    var roleLabels = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
    var roleBadgeClasses = { 'super_admin': 'badge-super_admin', 'admin': 'badge-admin', 'teacher': 'badge-teacher', 'master': 'badge-master', 'viewer': 'badge-viewer' };

    var html = '<div class="invite-grid">';
    filtered.forEach(function(invite) {
        var isRegistered = invite.is_registered;
        var isUsed = invite.invite_used || invite.invite_status === 'expired';

        var statusClass = 'pending';
        var statusLabel = '⏳ Ожидает';

        if (isRegistered) { statusClass = 'registered'; statusLabel = '🔐 Зарегистрирован'; }
        else if (isUsed) { statusClass = 'used'; statusLabel = '✅ Использован'; }

        var registrationUrl = window.location.origin + '/register/index.html?code=' + invite.invite_code;
        var codeHtml = '';
        var actionsHtml = '';
        var categoryDisplay = categoryLabels[invite.category] || invite.category || 'Другие';

        if (isRegistered) {
            codeHtml = '<div style="background:#D1FAE5;padding:6px 12px;border-radius:var(--border-radius);text-align:center;margin:8px 0;border:2px solid var(--success);"><span style="color:var(--success-dark);font-weight:600;">✅ Пользователь уже зарегистрирован</span></div>';
            actionsHtml = '<div style="margin:4px 0;"><span class="user-login">👤 ' + invite.login + '</span></div>' +
                '<button class="btn btn-danger btn-xs" onclick="resetUserCredentials(\'' + invite.id + '\', \'' + (invite.full_name || '').replace(/'/g, "\\'") + '\')">🔄 Сбросить доступ</button>';
        } else {
            codeHtml = '<div class="code">' + invite.invite_code + '</div>';
            if (!isUsed) {
                actionsHtml = '<button class="btn btn-info btn-xs" onclick="copyCode(\'' + invite.invite_code + '\')">📋 Копировать</button>';
            } else {
                actionsHtml = '<button class="btn btn-info btn-xs" onclick="copyCode(\'' + invite.invite_code + '\')">📋 Копировать</button>' +
                    '<span style="font-size:11px;color:var(--text-muted);">Код использован</span>';
            }
        }

        html +=
            '<div class="invite-card">' +
                '<div class="name">' + invite.full_name + '</div>' +
                '<div class="position">' + (invite.position || '—') + '</div>' +
                '<div class="category">' + categoryDisplay + '</div>' +
                '<div style="margin:3px 0;">' +
                    '<span class="badge-role ' + (roleBadgeClasses[invite.role] || 'badge-viewer') + '">' + (roleLabels[invite.role] || invite.role) + '</span> ' +
                    '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
                '</div>' +
                codeHtml +
                '<div style="font-size:11px;color:var(--text-muted);">🔗 <a href="' + registrationUrl + '" target="_blank" class="registration-link">' + registrationUrl + '</a></div>' +
                '<div class="actions">' + actionsHtml + '</div>' +
            '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
}

function copyCode(code) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function() { showToast('✅ Код скопирован!', 'success'); })
        .catch(function() { showToast('❌ Не удалось скопировать', 'error'); });
    } else { showToast('❌ Копирование не поддерживается', 'error'); }
}

async function resetUserCredentials(userId, fullName) {
    if (!confirm('Сбросить доступ для ' + fullName + '?\n\nЭто действие:\n• Сгенерирует НОВЫЙ пригласительный код\n• Удалит текущий логин и пароль\n• Завершит все активные сессии\n• Потребует повторной регистрации')) return;
    try {
        var part1 = Math.floor(1000 + Math.random() * 9000).toString();
        var part2 = Math.floor(1000 + Math.random() * 9000).toString();
        var newInviteCode = part1 + '-' + part2;
        var result = await sb.from('users').update({ login: null, password_hash: null, invite_code: newInviteCode, invite_used: false, invite_status: 'pending', active_session_id: null }).eq('id', userId);
        if (result.error) throw result.error;
        showToast('✅ Доступ сброшен! Новый код: ' + newInviteCode, 'success');
        await loadInvites();
    } catch (error) { showToast('❌ Ошибка: ' + error.message, 'error'); }
}

// ============================================================
// ЭКСПОРТ В PDF (Альбомная ориентация + защита от разрывов)
// ============================================================
function exportToPDF() {
    var filtered = getFilteredInvites();

    if (!filtered || filtered.length === 0) {
        showToast('❌ Нет данных для экспорта', 'error');
        return;
    }

    var dateStr = new Date().toLocaleDateString('ru-RU');
    var userName = currentUser ? (currentUser.full_name || currentUser.name || currentUser.login || 'Пользователь') : 'Пользователь';

    var roleLabels = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };

    var cardsHtml = '';
    filtered.forEach(function(invite) {
        var registrationUrl = window.location.origin + '/register/index.html?code=' + invite.invite_code;
        cardsHtml +=
            '<div class="pdf-cut-card">' +
                '<div class="pdf-card-name">' + invite.full_name + '</div>' +
                '<div class="pdf-card-pos">' + (invite.position || '—') + ' · ' + (roleLabels[invite.role] || invite.role) + '</div>' +
                '<div class="pdf-card-code">' + invite.invite_code + '</div>' +
                '<div class="pdf-card-url">' + registrationUrl + '</div>' +
                '<div class="pdf-card-role">✂️ Для регистрации перейдите по ссылке и введите код</div>' +
            '</div>';
    });

    var pdfHtml =
        '<div class="pdf-content">' +
            '<div class="pdf-header">' +
                '<div class="pdf-title">Пригласительные коды</div>' +
                '<div class="pdf-subtitle">Дата: ' + dateStr + ' · Всего: ' + filtered.length + ' · Сформировал(а): ' + userName + '</div>' +
            '</div>' +
            '<div class="pdf-cards-grid">' + cardsHtml + '</div>' +
        '</div>';

    var content = document.createElement('div');
    content.innerHTML = pdfHtml;
    content.style.cssText = 'padding: 10px; background: white;';

    var opt = {
        margin: [8, 8, 8, 8],
        filename: 'Пригласительные_коды_' + dateStr.replace(/\./g, '-') + '.pdf',
        image: { type: 'jpeg', quality: 1 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }, // <-- АЛЬБОМНАЯ ОРИЕНТАЦИЯ
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } // <-- Защита от разрывов
    };

    var btn = document.getElementById('exportPdfBtn');
    var orig = btn.innerHTML;
    btn.innerHTML = '⏳ ...';
    btn.disabled = true;

    html2pdf().set(opt).from(content).save().then(function() {
        btn.innerHTML = orig;
        btn.disabled = false;
        showToast('✅ PDF готов');
    }).catch(function(error) {
        console.error(error);
        btn.innerHTML = orig;
        btn.disabled = false;
        showToast('❌ Ошибка PDF: ' + error.message, 'error');
    });
}

function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

async function init() {
    if (window.Session && typeof window.Session.init === 'function') {
        try { var sessionOk = await window.Session.init(); if (sessionOk === false) return; } catch (e) {}
    }
    sb = getSupabaseClient();
    if (!sb) { showToast('❌ Ошибка подключения к базе данных', 'error'); return; }
    waitForHeaderAndSidebar(function() { bindHeaderButtons(); loadUser(); });
}

function boot() { if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); } }
boot();
</script>
</body>
</html>
