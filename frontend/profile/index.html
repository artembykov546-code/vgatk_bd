<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | vgatk_bd</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <!-- ===== ШРИФТЫ ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <!-- ===== ЕДИНЫЙ ФАЙЛ ДИЗАЙНА ===== -->
    <link rel="stylesheet" href="/css/components.css">

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ===== Сессия ===== -->
    <script src="/js/session.js"></script>

    <!-- ===== Наименование УО (Шапка) ===== -->
    <script src="/js/header.js?v=2"></script>

    <!-- ===== Боковое меню ===== -->
    <script src="/js/sidebar.js?v=2"></script>
    <script src="/js/notifications.js?v=1"></script>
    <script src="/js/notifications-bind.js?v=1"></script>

    <style>
        .page-container { max-width: 1000px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--primary); }
        .page-title small { font-weight: 400; font-size: 14px; color: var(--text-muted); }

        .profile-card { background: var(--bg-card); border-radius: var(--border-radius-xl); padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .profile-card .avatar { font-size: 72px; text-align: center; display: block; margin-bottom: 4px; }
        .profile-card .profile-name { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; }
        .profile-card .sub-info { text-align: center; color: var(--text-secondary); margin-top: 6px; font-size: 14px; }
        .profile-card .position-text { text-align: center; color: var(--text-muted); margin-top: 2px; font-size: 13px; font-style: italic; }
        .profile-divider { margin: 16px 0 20px; border: none; border-top: 2px solid var(--border); }
        .profile-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
        .profile-info .item { display: flex; padding: 6px 0; border-bottom: 1px solid var(--border); align-items: center; }
        .profile-info .item .label { font-weight: 600; color: var(--text-secondary); width: 160px; flex-shrink: 0; }
        .profile-info .item .value { color: var(--text-primary); flex: 1; }
        .profile-info .item .value .tag-item { background: var(--bg-main); padding: 2px 10px; border-radius: 12px; font-size: 13px; border: 1px solid var(--border); display: inline-block; margin: 2px 4px 2px 0; }

        .badge-role { display: inline-block; padding: 4px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .badge-super_admin { background: #FADBD8; color: #78281F; }
        .badge-admin { background: #FDEBD0; color: #7E5109; }
        .badge-teacher { background: #D5F5E3; color: #1A6E3A; }
        .badge-master { background: #D6EAF8; color: #1A5276; }
        .badge-viewer { background: #F1F5F9; color: #475569; }

        .toast-notification {
            position: fixed; top: 80px; right: 20px; padding: 16px 24px;
            border-radius: var(--border-radius); color: white; font-weight: 600;
            z-index: 9999; animation: slideUp 0.3s ease; max-width: 400px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-notification .toast-close { float: right; margin-left: 16px; cursor: pointer; font-size: 18px; opacity: 0.8; }
        .toast-notification .toast-close:hover { opacity: 1; }

        @media (max-width: 768px) {
            .profile-card { padding: 20px; }
            .profile-info { grid-template-columns: 1fr; }
            .profile-info .item .label { width: 120px; }
            .page-title { font-size: 20px; }
            .toast-notification { left: 20px; right: 20px; top: 80px; }
        }
        @media (max-width: 480px) {
            .profile-card .profile-name { font-size: 20px; }
            .page-title { font-size: 18px; }
            .profile-info .item .label { width: 100px; }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1E3A8A">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header"></header>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar"></aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main-content">
    <div class="page-container">

        <div class="page-header">
            <div>
                <h1 class="page-title">⚙️ Профиль <small>информация об аккаунте</small></h1>
            </div>
        </div>

        <!-- Информация о пользователе (только просмотр) -->
        <div class="profile-card" id="profileCard">
            <span class="avatar">👤</span>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="sub-info" id="profileRole">Загрузка...</div>
            <div class="position-text" id="profilePosition"></div>
            <hr class="profile-divider">
            <div class="profile-info" id="profileInfo"></div>
        </div>

    </div>
</main>

<script>
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
var sb = null;
var currentUser = null;
var currentEmployee = null;
var groups = [];

// ============================================================
// ЖДЁМ ОТРИСОВКИ ШАПКИ (header.js / sidebar.js)
// ============================================================
function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) {
        callback();
        return;
    }
    if (attempts > 100) {
        console.warn('⚠️ Шапка/сайдбар так и не отрисовались, продолжаем всё равно');
        callback();
        return;
    }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

// ============================================================
// ПОЛУЧЕНИЕ КЛИЕНТА SUPABASE
// ============================================================
function getSupabaseClient() {
    if (window.Session && typeof window.Session.supabase === 'function') {
        var client = window.Session.supabase();
        if (client) return client;
    }
    if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
        return window.supabaseClient;
    }
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        var client = window.supabase.createClient(
            'https://selbolepupendprhixas.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbGJvbGVwdXBlbmRwcmhpeGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjQzODgsImV4cCI6MjA5ODE0MDM4OH0.UpWEr6hEs9ytnDxnaQ7Uf3d_xDQLHO-eejkIw53o7EE'
        );
        window.supabaseClient = client;
        return client;
    }
    return null;
}

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) { window.location.href = '/'; return false; }
        try { user = JSON.parse(savedUser); } catch (e) {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
            return false;
        }
    }
    currentUser = user;

    waitForHeaderAndSidebar(function() {
        var nameEl = document.getElementById('userNameDisplay');
        var roleEl = document.getElementById('userRoleDisplay');
        if (nameEl) nameEl.textContent = user.full_name || user.name || user.login;
        var roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
        if (roleEl) roleEl.textContent = roleMap[user.role] || user.role;
    });

    await loadUserData();
    return true;
}

function bindHeaderButtons() {
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn && !logoutBtn.__bound) {
        logoutBtn.__bound = true;
        logoutBtn.onclick = function() {
            if (window.Session && typeof window.Session.logout === 'function') {
                window.Session.logout();
            } else {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            }
        };
    }
    var menuToggle = document.getElementById('menuToggle');
    if (menuToggle && !menuToggle.__bound) {
        menuToggle.__bound = true;
        menuToggle.onclick = function() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        };
        if (window.innerWidth > 768) {
            menuToggle.style.display = 'none';
        } else {
            menuToggle.style.display = 'inline-block';
        }
    }
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 4000);
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================
async function loadUserData() {
    try {
        if (currentUser.employee_id) {
            var empResult = await sb
                .from('employees')
                .select('*')
                .eq('id', currentUser.employee_id)
                .single();

            if (empResult.error) {
                console.warn('⚠️ Сотрудник не найден:', empResult.error);
                currentEmployee = null;
            } else {
                currentEmployee = empResult.data;
                currentUser.full_name = currentEmployee.full_name;
                currentUser.position = currentEmployee.position;
                currentUser.category = currentEmployee.category;
                currentUser.groups = currentEmployee.groups || [];
            }
        }

        var groupsResult = await sb
            .from('groups')
            .select('id, name, type')
            .eq('is_archived', false)
            .order('name');

        if (!groupsResult.error && groupsResult.data) {
            groups = groupsResult.data;
        }

        renderProfile();

    } catch (error) {
        console.error('❌ Ошибка загрузки данных:', error);
        showToast('❌ Ошибка загрузки данных: ' + error.message, 'error');
    }
}

// ============================================================
// РЕНДЕРИНГ ПРОФИЛЯ
// ============================================================
function renderProfile() {
    if (!currentUser) return;

    var roleBadge = {
        'super_admin': 'badge-super_admin',
        'admin': 'badge-admin',
        'teacher': 'badge-teacher',
        'master': 'badge-master',
        'viewer': 'badge-viewer'
    };

    var categoryLabels = {
        'teachers': 'Преподаватель (Куратор)',
        'masters': 'Мастер ПО',
        'administration': 'Администрация',
        'other': 'Другие'
    };

    var fullName = (currentEmployee && currentEmployee.full_name) || currentUser.full_name || currentUser.login || '';
    document.getElementById('profileName').textContent = fullName;

    var accessMap = {
        'super_admin': 'Полный доступ ко всем данным',
        'admin': 'Полный доступ (кроме супер-админов)',
        'teacher': 'Доступ к своим группам',
        'master': 'Доступ к своим группам',
        'viewer': 'Только просмотр'
    };
    var roleText = accessMap[currentUser.role] || currentUser.role || '—';
    var badgeClass = roleBadge[currentUser.role] || 'badge-viewer';
    document.getElementById('profileRole').innerHTML = '<span class="badge-role ' + badgeClass + '">' + roleText + '</span>';

    var positionEl = document.getElementById('profilePosition');
    var positionValue = (currentEmployee && currentEmployee.position) || currentUser.position || '';
    if (positionValue && positionValue.trim() !== '') {
        positionEl.textContent = '💼 ' + positionValue;
        positionEl.style.display = 'block';
    } else {
        positionEl.textContent = '';
        positionEl.style.display = 'none';
    }

    var infoDiv = document.getElementById('profileInfo');
    var html = '';

    html +=
        '<div class="item"><span class="label">💼 Должность</span><span class="value">' + (positionValue || '—') + '</span></div>' +
        '<div class="item"><span class="label">🔑 Логин</span><span class="value">' + currentUser.login + '</span></div>' +
        '<div class="item"><span class="label">🆔 ID</span><span class="value">' + currentUser.id + '</span></div>';

    var category = (currentEmployee && currentEmployee.category) || currentUser.category || 'other';
    html +=
        '<div class="item"><span class="label">📋 Категория</span><span class="value">' + (categoryLabels[category] || category || '—') + '</span></div>';

    if (currentEmployee && currentEmployee.groups && Array.isArray(currentEmployee.groups) && currentEmployee.groups.length > 0) {
        var groupNames = currentEmployee.groups.map(function(gid) {
            var g = groups.find(function(gr) { return gr.id === gid; });
            return g ? g.name + ' (' + (g.type === 'sso' ? 'ССО' : 'ПТО') + ')' : gid;
        });
        var roleType = category === 'teachers' ? '👨‍🏫 Куратор групп' : '🔧 Мастер ПО групп';
        var tagsHtml = groupNames.map(function(n) { return '<span class="tag-item">' + n + '</span>'; }).join('');
        html +=
            '<div class="item" style="grid-column:1/-1;">' +
                '<span class="label">' + roleType + '</span>' +
                '<span class="value">' + tagsHtml + '</span>' +
            '</div>';
    } else if (category === 'administration') {
        html +=
            '<div class="item" style="grid-column:1/-1;">' +
                '<span class="label">🏢 Руководство</span>' +
                '<span class="value" style="color:var(--text-muted);">Администрация колледжа</span>' +
            '</div>';
    }

    var accessDetails = {
        'super_admin': '🔓 Полный доступ ко всем данным',
        'admin': '🔓 Полный доступ (кроме супер-админов)',
        'teacher': '📖 Доступ к своим группам',
        'master': '📖 Доступ к своим группам',
        'viewer': '👁️ Только просмотр'
    };
    html +=
        '<div class="item" style="grid-column:1/-1;">' +
            '<span class="label">🔐 Права доступа</span>' +
            '<span class="value">' + (accessDetails[currentUser.role] || '—') + '</span>' +
        '</div>';

    infoDiv.innerHTML = html;
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init() {
    if (window.Session && typeof window.Session.init === 'function') {
        try {
            var sessionOk = await window.Session.init();
            if (sessionOk === false) return;
        } catch (e) {
            console.warn('⚠️ Session.init() ошибка:', e);
        }
    }

    sb = getSupabaseClient();
    if (!sb) {
        console.error('❌ Не удалось получить клиент Supabase');
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    waitForHeaderAndSidebar(function() {
        bindHeaderButtons();
        loadUser();
    });
}

function boot() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
}

boot();
</script>

</body>
</html>
