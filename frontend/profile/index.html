<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | vgatk_bd</title>
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    
    <!-- ===== ШРИФТЫ ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    
    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1E3A8A; --primary-light: #3B82F6; --secondary: #2563EB;
            --success: #10B981; --success-dark: #059669; --warning: #F59E0B; --warning-dark: #D97706;
            --danger: #EF4444; --danger-dark: #DC2626;
            --bg-main: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 25%, #f0f9ff 50%, #fef3c7 75%, #fde68a 100%);
            --bg-card: rgba(255, 255, 255, 0.96);
            --text-primary: #1E293B; --text-secondary: #475569; --text-muted: #64748B;
            --border: #dbeafe; --border-radius: 8px; --border-radius-lg: 12px; --border-radius-xl: 16px;
            --shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
            --header-height: 74px; --sidebar-width: 220px; --transition: all 0.3s ease;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); background-attachment: fixed; min-height: 100vh; color: var(--text-primary); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header { background: var(--bg-card); backdrop-filter: blur(12px); padding: 12px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12); border-bottom: 1px solid var(--border); min-height: var(--header-height); }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .college-name { font-family: 'Lobster', cursive; font-size: 16px; color: var(--primary); line-height: 1.2; letter-spacing: 0.5px; }
        .college-name .sub { font-family: 'Lobster', cursive; font-size: 16px; color: var(--primary); }
        .header-user { display: flex; align-items: center; gap: 16px; }
        .header-user-info { text-align: right; }
        .header-user-name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .header-user-role { font-size: 12px; color: var(--text-muted); }
        .btn-logout { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); color: white; border: none; padding: 8px 16px; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 13px; transition: var(--transition); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-logout:hover { background: linear-gradient(135deg, var(--danger-dark), #B91C1C); box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); transform: translateY(-2px); }

        .sidebar { position: fixed; left: 0; top: var(--header-height); width: var(--sidebar-width); height: calc(100vh - var(--header-height)); background: var(--bg-card); backdrop-filter: blur(12px); padding: 20px 0; overflow-y: auto; z-index: 90; border-right: 1px solid var(--border); box-shadow: 4px 0 20px rgba(59, 130, 246, 0.08); }
        .sidebar-nav { list-style: none; padding: 0 16px; }
        .sidebar-nav li { margin-bottom: 4px; }
        .sidebar-nav .nav-label { padding: 12px 16px 6px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: var(--border-radius); color: var(--text-secondary); font-weight: 500; font-size: 14px; transition: var(--transition); text-decoration: none; }
        .sidebar-nav a:hover { background: rgba(59, 130, 246, 0.08); color: var(--primary-light); }
        .sidebar-nav a.active { background: rgba(59, 130, 246, 0.12); color: var(--primary-light); }
        .sidebar-nav a .icon { font-size: 20px; width: 24px; text-align: center; }

        .main-content { margin-left: var(--sidebar-width); padding: 24px 32px; min-height: calc(100vh - var(--header-height)); animation: fadeIn 0.6s ease; }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border: none; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; font-size: 13px; transition: var(--transition); text-decoration: none; }
        .btn:hover { transform: translateY(-2px); }
        .btn-success { background: linear-gradient(135deg, var(--success), var(--success-dark)); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background: linear-gradient(135deg, var(--success-dark), #047857); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, #94A3B8, #64748B); color: white; box-shadow: 0 4px 15px rgba(148, 163, 184, 0.3); }
        .btn-secondary:hover { background: linear-gradient(135deg, #64748B, #475569); box-shadow: 0 8px 25px rgba(148, 163, 184, 0.4); }
        .btn-primary { background: linear-gradient(135deg, var(--primary-light), var(--secondary)); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .btn-primary:hover { background: linear-gradient(135deg, var(--secondary), #1D4ED8); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }

        .page-container { max-width: 1000px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--primary); }
        .page-title small { font-weight: 400; font-size: 14px; color: var(--text-muted); }

        .profile-card { background: var(--bg-card); border-radius: var(--border-radius-xl); padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .profile-card .avatar { font-size: 72px; text-align: center; display: block; margin-bottom: 4px; }
        .profile-card .profile-name { font-size: 24px; font-weight: 700; color: var(--primary); text-align: center; }
        .profile-card .sub-info { text-align: center; color: var(--text-secondary); margin-top: 2px; font-size: 14px; }
        .profile-card .position-text { text-align: center; color: var(--text-muted); margin-top: 2px; font-size: 13px; font-style: italic; }
        .profile-divider { margin: 16px 0 20px; border: none; border-top: 2px solid var(--border); }
        .profile-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
        .profile-info .item { display: flex; padding: 6px 0; border-bottom: 1px solid var(--border); align-items: center; }
        .profile-info .item .label { font-weight: 600; color: var(--text-secondary); width: 160px; flex-shrink: 0; }
        .profile-info .item .value { color: var(--text-primary); flex: 1; }
        .profile-info .item .value .tag-item { background: var(--bg-main); padding: 2px 10px; border-radius: 12px; font-size: 13px; border: 1px solid var(--border); display: inline-block; margin: 2px 4px 2px 0; }

        .badge-role { display: inline-block; padding: 4px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .badge-super_admin { background: #FADBD8; color: #78281F; }
        .badge-admin { background: #FDEBD0; color: #7E5109; }
        .badge-teacher { background: #D5F5E3; color: #1A6E3A; }
        .badge-viewer { background: #D6EAF8; color: #1A5276; }

        .toast-notification {
            position: fixed; top: 80px; right: 20px; padding: 16px 24px;
            border-radius: var(--border-radius); color: white; font-weight: 600;
            z-index: 9999; animation: slideUp 0.3s ease; max-width: 400px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
        }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-notification .toast-close { float: right; margin-left: 16px; cursor: pointer; font-size: 18px; opacity: 0.8; }
        .toast-notification .toast-close:hover { opacity: 1; }

        @media (max-width: 768px) {
            .header { padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
            .college-name { font-size: 13px; } .college-name .sub { font-size: 13px; }
            .header-user-info { display: none; }
            .sidebar { transform: translateX(-100%); width: 280px; top: var(--header-height); height: calc(100vh - var(--header-height)); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .profile-card { padding: 20px; }
            .profile-info { grid-template-columns: 1fr; }
            .profile-info .item .label { width: 120px; }
            .page-title { font-size: 20px; }
            #menuToggle { display: inline-block !important; }
        }
        @media (max-width: 480px) {
            .college-name { font-size: 11px; } .college-name .sub { font-size: 11px; }
            .profile-card .profile-name { font-size: 20px; }
            .page-title { font-size: 18px; }
            .profile-info .item .label { width: 100px; }
        }
        @media (min-width: 769px) { #menuToggle { display: none !important; } }
    </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
    <div class="header-logo">
        <span class="college-name">
            Учреждение образования<br>
            <span class="sub">"Витебский государственный аграрно-технический колледж"</span>
        </span>
    </div>
    <div class="header-user">
        <div class="header-user-info">
            <div class="header-user-name" id="userNameDisplay">Загрузка...</div>
            <div class="header-user-role" id="userRoleDisplay">Загрузка...</div>
        </div>
        <button class="btn-logout" id="logoutBtn">🚪 Выйти</button>
    </div>
</header>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
        <li class="nav-label">Главное</li>
        <li><a href="/dashboard.html"><span class="icon">🏠</span> Главная</a></li>
        <li><a href="/employees/index.html"><span class="icon">👨‍🏫</span> Сотрудники</a></li>
        <li><a href="/students/index.html"><span class="icon">👨‍🎓</span> Учащиеся</a></li>
        <li><a href="/graduates/index.html"><span class="icon">🎓</span> Выпускники</a></li>
        <li><a href="/reports/index.html"><span class="icon">📊</span> Отчёты</a></li>
        <li class="nav-label" style="margin-top:12px;">Система</li>
        <li><a href="/profile/index.html" class="active"><span class="icon">⚙️</span> Профиль</a></li>
    </ul>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<main class="main-content">
    <button class="btn btn-secondary btn-sm" id="menuToggle" style="margin-bottom:16px;display:none;">☰ Меню</button>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1 class="page-title">⚙️ Профиль <small>информация об аккаунте</small></h1>
            </div>
        </div>

        <!-- Информация о пользователе (только просмотр) -->
        <div class="profile-card" id="profileCard">
            <span class="avatar">👤</span>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="sub-info" id="profileRole">Загрузка...</div>
            <div class="position-text" id="profilePosition"></div>
            <hr class="profile-divider">
            <div class="profile-info" id="profileInfo"></div>
        </div>

    </div>
</main>

<script>
// ============================================================
// КОНФИГУРАЦИЯ SUPABASE
// ============================================================

const SUPABASE_URL = 'https://selbolepupendprhixas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbGJvbGVwdXBlbmRwcmhpeGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjQzODgsImV4cCI6MjA5ODE0MDM4OH0.UpWEr6hEs9ytnDxnaQ7Uf3d_xDQLHO-eejkIw53o7EE';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
console.log('✅ Supabase инициализирован');

// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================

let currentUser = null;
let currentEmployee = null;
let groups = [];

// Генерируем уникальный ID устройства при загрузке
function generateDeviceSessionId() {
    const ua = navigator.userAgent || '';
    const screen = window.screen.width + 'x' + window.screen.height;
    const timestamp = Date.now();
    const random = Math.random().toString(36).substring(2, 8);
    const base = btoa(ua.substring(0, 50) + screen).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20);
    return 'device_' + base + '_' + timestamp + '_' + random;
}

const currentDeviceSessionId = generateDeviceSessionId();
console.log('🆔 ID устройства:', currentDeviceSessionId);

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================

function loadUser() {
    const savedUser = localStorage.getItem('currentUser');
    if (!savedUser) {
        window.location.href = '/index.html';
        return;
    }

    try {
        const user = JSON.parse(savedUser);
        document.getElementById('userNameDisplay').textContent = user.full_name || user.name || user.login;
        const roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'viewer': 'Наблюдатель' };
        document.getElementById('userRoleDisplay').textContent = roleMap[user.role] || user.role;
        currentUser = user;
        
        loadUserData();
    } catch (e) {
        localStorage.removeItem('currentUser');
        window.location.href = '/index.html';
    }
}

document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('currentUser');
    window.location.href = '/index.html';
};

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================

async function loadUserData() {
    try {
        // Загружаем данные сотрудника (employee)
        if (currentUser.employee_id) {
            const { data: employee, error: empError } = await supabaseClient
                .from('employees')
                .select('*')
                .eq('id', currentUser.employee_id)
                .single();

            if (empError) {
                console.warn('⚠️ Сотрудник не найден:', empError);
                currentEmployee = null;
            } else {
                currentEmployee = employee;
                currentUser.full_name = employee.full_name;
                currentUser.position = employee.position;
                currentUser.category = employee.category;
                currentUser.groups = employee.groups || [];
            }
        }

        // Загружаем группы
        const { data: groupsData, error: groupsError } = await supabaseClient
            .from('groups')
            .select('id, name, type')
            .eq('is_archived', false)
            .order('name');

        if (!groupsError && groupsData) {
            groups = groupsData;
        }

        renderProfile();

    } catch (error) {
        console.error('❌ Ошибка загрузки данных:', error);
        showToast('❌ Ошибка загрузки данных: ' + error.message, 'error');
    }
}

// ============================================================
// РЕНДЕРИНГ ПРОФИЛЯ (ТОЛЬКО ПРОСМОТР)
// ============================================================

function renderProfile() {
    if (!currentUser) return;

    const roleBadge = {
        'super_admin': 'badge-super_admin',
        'admin': 'badge-admin',
        'teacher': 'badge-teacher',
        'viewer': 'badge-viewer'
    };

    const categoryLabels = {
        'teachers': 'Преподаватель (Куратор)',
        'masters': 'Мастер ПО',
        'administration': 'Администрация',
        'other': 'Другие'
    };

    // ФИО
    const fullName = currentEmployee?.full_name || currentUser.full_name || currentUser.login || '';
    document.getElementById('profileName').textContent = fullName;
    
    // Права доступа
    const accessMap = {
        'super_admin': 'Полный доступ ко всем данным',
        'admin': 'Полный доступ (кроме супер-админов)',
        'teacher': 'Доступ к своим группам',
        'viewer': 'Только просмотр'
    };
    document.getElementById('profileRole').innerHTML = `<span class="badge-role ${roleBadge[currentUser.role]}">${accessMap[currentUser.role] || '—'}</span>`;
    
    // Должность
    const positionEl = document.getElementById('profilePosition');
    const positionValue = currentEmployee?.position || currentUser.position || '';
    if (positionValue && positionValue.trim() !== '') {
        positionEl.textContent = '💼 ' + positionValue;
        positionEl.style.display = 'block';
    } else {
        positionEl.textContent = '';
        positionEl.style.display = 'none';
    }

    const infoDiv = document.getElementById('profileInfo');
    let html = '';

    html += `
        <div class="item"><span class="label">💼 Должность</span><span class="value">${positionValue || '—'}</span></div>
        <div class="item"><span class="label">🔑 Логин</span><span class="value">${currentUser.login}</span></div>
        <div class="item"><span class="label">🆔 ID</span><span class="value">${currentUser.id}</span></div>
    `;

    // Категория
    const category = currentEmployee?.category || currentUser.category || 'other';
    html += `
        <div class="item"><span class="label">📋 Категория</span><span class="value">${categoryLabels[category] || category || '—'}</span></div>
    `;

    // Группы
    if (currentEmployee?.groups && Array.isArray(currentEmployee.groups) && currentEmployee.groups.length > 0) {
        const groupNames = currentEmployee.groups.map(function(gid) {
            const g = groups.find(function(gr) { return gr.id === gid; });
            return g ? g.name + ' (' + (g.type === 'sso' ? 'ССО' : 'ПТО') + ')' : gid;
        });
        const roleType = category === 'teachers' ? '👨‍🏫 Куратор групп' : '🔧 Мастер ПО групп';
        html += `
            <div class="item" style="grid-column:1/-1;">
                <span class="label">${roleType}</span>
                <span class="value">${groupNames.map(function(n) { return '<span class="tag-item">' + n + '</span>'; }).join('')}</span>
            </div>
        `;
    } else if (category === 'administration') {
        html += `
            <div class="item" style="grid-column:1/-1;">
                <span class="label">🏢 Руководство</span>
                <span class="value" style="color:var(--text-muted);">Администрация колледжа</span>
            </div>
        `;
    }

    // Права доступа (детально)
    const accessDetails = {
        'super_admin': '🔓 Полный доступ ко всем данным',
        'admin': '🔓 Полный доступ (кроме супер-админов)',
        'teacher': '📖 Доступ к своим группам',
        'viewer': '👁️ Только просмотр'
    };
    html += `
        <div class="item" style="grid-column:1/-1;">
            <span class="label">🔐 Права доступа</span>
            <span class="value">${accessDetails[currentUser.role] || '—'}</span>
        </div>
    `;

    infoDiv.innerHTML = html;
}

// ============================================================
// TOAST УВЕДОМЛЕНИЯ
// ============================================================

function showToast(message, type) {
    type = type || 'success';
    const existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);

    setTimeout(function() {
        if (toast.parentElement) toast.remove();
    }, 4000);
}

// ============================================================
// МОБИЛЬНОЕ МЕНЮ
// ============================================================

document.getElementById('menuToggle').onclick = function() {
    document.getElementById('sidebar').classList.toggle('open');
};

if (window.innerWidth <= 768) {
    document.getElementById('menuToggle').style.display = 'inline-block';
}

window.onresize = function() {
    if (window.innerWidth <= 768) {
        document.getElementById('menuToggle').style.display = 'inline-block';
    } else {
        document.getElementById('menuToggle').style.display = 'none';
        document.getElementById('sidebar').classList.remove('open');
    }
};

// ============================================================
// ЗАПУСК
// ============================================================

loadUser();
</script>

</body>
</html>
