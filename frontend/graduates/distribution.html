<script>

// ============================================================
// ЖДЁМ ОТРИСОВКИ ШАПКИ (header.js / sidebar.js)
// ============================================================
function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) {
        callback();
        return;
    }
    if (attempts > 100) {
        console.warn('⚠️ Шапка/сайдбар так и не отрисовались, продолжаем всё равно');
        callback();
        return;
    }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + msg;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) { window.location.href = '/'; return false; }
        try { user = JSON.parse(savedUser); } catch (e) {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
            return false;
        }
    }
    currentUser = user;
    hasEditRights = user.role === 'super_admin' || user.role === 'admin';

    waitForHeaderAndSidebar(function() {
        var nameEl = document.getElementById('userNameDisplay');
        var roleEl = document.getElementById('userRoleDisplay');
        if (nameEl) nameEl.textContent = user.name || user.full_name || user.login;
        var roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
        if (roleEl) roleEl.textContent = roleMap[user.role] || user.role;
    });
    return true;
}

function bindHeaderButtons() {
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn && !logoutBtn.__bound) {
        logoutBtn.__bound = true;
        logoutBtn.onclick = function() {
            if (window.Session && typeof window.Session.logout === 'function') {
                window.Session.logout();
            } else {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            }
        };
    }
    var menuToggle = document.getElementById('menuToggle');
    if (menuToggle && !menuToggle.__bound) {
        menuToggle.__bound = true;
        menuToggle.onclick = function() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        };
        if (window.innerWidth > 768) {
            menuToggle.style.display = 'none';
        } else {
            menuToggle.style.display = 'inline-block';
        }
    }
}

// ============================================================
// ФУНКЦИИ ФОРМАТИРОВАНИЯ
// ============================================================
function formatDate(dateStr) {
    if (!dateStr) return '—';
    var d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function getTypeLabel(type) {
    return type === 'sso' ? 'ССО' : 'ПТО';
}

function highlightText(text, query) {
    if (!query || !text) return text;
    var regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
}

// ============================================================
// ЗАГРУЗКА ГРУПП
// ============================================================
async function loadGroups() {
    var select = document.getElementById('groupSelect');
    
    if (!sb) {
        select.innerHTML = '<option value="">— Ошибка подключения —</option>';
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    try {
        var groupsResult = await sb
            .from('groups')
            .select('id, name, type, specialty, qualification')
            .eq('is_archived', true)
            .order('name');

        if (groupsResult.error) throw groupsResult.error;

        var groups = groupsResult.data || [];

        var graduatesResult = await sb
            .from('graduates')
            .select('group_name');

        if (graduatesResult.error) throw graduatesResult.error;

        var graduates = graduatesResult.data || [];

        var groupsWithGraduates = {};
        graduates.forEach(function(g) {
            if (g.group_name) groupsWithGraduates[g.group_name] = true;
        });

        var filteredGroups = groups.filter(function(g) {
            return groupsWithGraduates[g.name];
        });

        if (filteredGroups.length === 0 && groups.length > 0) {
            filteredGroups = groups;
        }

        select.innerHTML = '<option value="">— Выберите группу —</option>';
        if (filteredGroups.length > 0) {
            filteredGroups.forEach(function(g) {
                var typeLabel = getTypeLabel(g.type || 'pto');
                select.innerHTML += '<option value="' + g.id + '">' + g.name + ' (' + typeLabel + ')</option>';
            });
        } else {
            var allGroupsResult = await sb
                .from('groups')
                .select('id, name, type')
                .order('name');

            var allGroups = allGroupsResult.data || [];

            if (allGroups.length > 0) {
                allGroups.forEach(function(g) {
                    var typeLabel = getTypeLabel(g.type || 'pto');
                    select.innerHTML += '<option value="' + g.id + '">' + g.name + ' (' + typeLabel + ')</option>';
                });
            } else {
                select.innerHTML = '<option value="">— Нет доступных групп —</option>';
            }
        }

        // Автоматическая загрузка по URL param
        var urlParams = new URLSearchParams(window.location.search);
        var groupIdFromUrl = urlParams.get('group_id');
        
        if (groupIdFromUrl) {
            select.value = groupIdFromUrl;
            if (select.value === groupIdFromUrl) {
                console.log('🔗 Автоматическая загрузка группы из URL:', groupIdFromUrl);
                setTimeout(function() { loadDistribution(); }, 300);
            }
        }

    } catch (error) {
        console.error('❌ Ошибка загрузки групп:', error);
        select.innerHTML = '<option value="">— Ошибка загрузки —</option>';
        showToast('❌ Ошибка загрузки групп: ' + error.message, 'error');
    }
}

// ============================================================
// ЗАГРУЗКА РАСПРЕДЕЛЕНИЯ
// ============================================================
async function loadDistribution() {
    var groupId = document.getElementById('groupSelect').value;

    if (!sb) {
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    if (!groupId) {
        document.getElementById('groupInfoCard').style.display = 'none';
        document.getElementById('tableContainer').style.display = 'none';
        document.getElementById('signatureBlock').style.display = 'none';
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6"><div class="empty-state"><span class="icon">📭</span><p>Выберите группу для просмотра распределения</p></div></td></tr>';
        return;
    }

    try {
        var groupResult = await sb
            .from('groups')
            .select('*')
            .eq('id', groupId)
            .single();

        if (groupResult.error || !groupResult.data) {
            var selectedOption = document.getElementById('groupSelect').selectedOptions[0];
            var selectedText = selectedOption ? selectedOption.textContent : 'Группа';
            currentGroupData = {
                id: groupId,
                name: selectedText.split(' (')[0] || 'Группа',
                type: 'pto',
                specialty: [],
                qualification: []
            };
        } else {
            currentGroupData = groupResult.data;
        }

        var graduatesResult = await sb
            .from('graduates')
            .select('*')
            .eq('group_name', currentGroupData.name)
            .order('full_name');

        if (graduatesResult.error) throw graduatesResult.error;

        var graduates = graduatesResult.data || [];

        var distributions = [];
        if (graduates.length > 0) {
            var studentIds = graduates.map(function(g) { return g.student_id; }).filter(Boolean);
            
            if (studentIds.length > 0) {
                try {
                    var distResult = await sb
                        .from('graduate_distributions')
                        .select('*')
                        .in('student_id', studentIds);

                    if (!distResult.error && distResult.data) {
                        distributions = distResult.data;
                    }
                } catch (e) {
                    console.warn('⚠️ Таблица graduate_distributions не найдена или недоступна');
                }
            }

            var distMap = {};
            distributions.forEach(function(d) {
                distMap[d.student_id] = d;
            });

            distributionsData = graduates.map(function(g) {
                var dist = distMap[g.student_id];
                return {
                    full_name: g.full_name,
                    organization_name: dist ? (dist.organization_name || null) : null,
                    address: dist ? (dist.address || null) : null,
                    notes: dist ? (dist.notes || null) : null,
                    phone: g.phone || '—',
                    student_id: g.student_id,
                    graduation_year: g.graduation_year || '—'
                };
            });
        } else {
            distributionsData = [];
        }

        renderInfo(currentGroupData);
        renderTable(distributionsData);
        renderSignatures(currentGroupData);

        document.getElementById('groupInfoCard').style.display = 'block';
        document.getElementById('tableContainer').style.display = 'block';
        document.getElementById('signatureBlock').style.display = 'block';

        if (!isFirstLoad) {
            showToast('✅ Загружено ' + distributionsData.length + ' записей', 'success');
        } else {
            console.log('📊 Автозагрузка: ' + distributionsData.length + ' записей');
            isFirstLoad = false;
        }

    } catch (error) {
        console.error('❌ Ошибка загрузки:', error);
        showToast('❌ Ошибка загрузки: ' + error.message, 'error');
    }
}

function renderInfo(group) {
    document.getElementById('groupName').textContent = group.name || '—';
    document.getElementById('groupType').textContent = getTypeLabel(group.type || 'pto');
    document.getElementById('studentCount').textContent = distributionsData.length || 0;
    document.getElementById('specialtyName').textContent = group.specialty ? (Array.isArray(group.specialty) ? group.specialty.join(', ') : group.specialty) : '—';
    document.getElementById('qualificationName').textContent = group.qualification ? (Array.isArray(group.qualification) ? group.qualification.join(', ') : group.qualification) : '—';
}

function renderTable(distributions) {
    var tbody = document.getElementById('tableBody');
    var searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

    var filtered = distributions;
    if (searchQuery) {
        filtered = distributions.filter(function(d) {
            var fullName = (d.full_name || '').toLowerCase();
            var orgName = (d.organization_name || '').toLowerCase();
            var address = (d.address || '').toLowerCase();
            var notes = (d.notes || '').toLowerCase();
            return fullName.indexOf(searchQuery) !== -1 || 
                   orgName.indexOf(searchQuery) !== -1 || 
                   address.indexOf(searchQuery) !== -1 || 
                   notes.indexOf(searchQuery) !== -1;
        });
    }

    document.getElementById('filteredCount').textContent = filtered.length > 0 ? 'Найдено: ' + filtered.length : '';

    if (!filtered || filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><span class="icon">📭</span><p>' + (searchQuery ? 'Ничего не найдено по вашему запросу' : 'Нет данных о распределении') + '</p></div></td></tr>';
        return;
    }

    var html = '';
    filtered.forEach(function(d, i) {
        var hasOrg = d.organization_name && d.organization_name.trim() !== '';
        var fullName = searchQuery ? highlightText(d.full_name, searchQuery) : d.full_name;
        var address = searchQuery ? highlightText(d.address || '', searchQuery) : (d.address || '');

        html += 
            '<tr>' +
                '<td>' + (i + 1) + '.</td>' +
                '<td><span class="student-name">' + fullName + '</span></td>' +
                '<td>' +
                    (hasOrg ? '<span class="org-name">' + d.organization_name + '</span>' : '<span class="empty-org">Не распределён</span>') +
                '</td>' +
                '<td>' + (address || '—') + '</td>' +
                '<td>' + (d.notes || '—') + '</td>' +
                '<td>' +
                    (hasOrg ? '<span style="color:var(--success-dark);font-weight:600;">✅ Распределён</span>' : '<span style="color:var(--text-muted);">⏳ Не распределён</span>') +
                '</td>' +
            '</tr>';
    });

    tbody.innerHTML = html;
}

async function renderSignatures(group) {
    var block = document.getElementById('signatureBlock');
    var groupType = group ? group.type : 'sso';
    var html = '';

    if (!sb) {
        html = '<div class="signature-group"><div class="signature-title">Подписи:</div>' +
            '<div class="signature-row"><span class="name">__________________</span><span class="line"></span><span class="label">подпись</span></div></div>';
        block.innerHTML = html;
        return;
    }

    var employeesResult = await sb
        .from('employees')
        .select('full_name, category, groups')
        .eq('is_hidden', false);

    var category = groupType === 'sso' ? 'teachers' : 'masters';
    var title = groupType === 'sso' ? '👨‍🏫 Кураторы' : '🔧 Мастера ПО';

    var people = [];
    if (employeesResult.data) {
        people = employeesResult.data
            .filter(function(e) { return e.category === category && Array.isArray(e.groups) && e.groups.indexOf(group.id) !== -1; })
            .map(function(e) { return e.full_name; });
    }

    if (people.length > 0) {
        html += '<div class="signature-group"><div class="signature-title">' + title + ':</div>';
        people.forEach(function(p) {
            html += '<div class="signature-row"><span class="name">' + p + '</span><span class="line"></span><span class="label">подпись</span></div>';
        });
        html += '</div>';
    } else {
        html += '<div class="signature-group"><div class="signature-title">' + title + ':</div>' +
            '<div class="signature-row"><span class="name">__________________</span><span class="line"></span><span class="label">подпись</span></div></div>';
    }
    block.innerHTML = html;
}

// ============================================================
// ПОИСК
// ============================================================
function bindSearch() {
    document.getElementById('searchInput').addEventListener('input', function() {
        var searchBtn = document.getElementById('clearSearchBtn');
        if (this.value.trim()) {
            searchBtn.classList.add('visible');
        } else {
            searchBtn.classList.remove('visible');
        }
        
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() {
            renderTable(distributionsData);
        }, 300);
    });

    document.getElementById('clearSearchBtn').addEventListener('click', function() {
        var input = document.getElementById('searchInput');
        input.value = '';
        this.classList.remove('visible');
        renderTable(distributionsData);
    });
}

// ============================================================
// ЭКСПОРТ В PDF
// ============================================================
function exportToPDF() {
    if (!currentGroupData || distributionsData.length === 0) {
        showToast('❌ Нет данных для экспорта', 'error');
        return;
    }
    var btn = document.getElementById('exportPdfBtn');
    btn.innerHTML = '⏳ ...';
    btn.disabled = true;
    var el = document.getElementById('pdfContent');
    
    var printStyles = document.createElement('style');
    printStyles.textContent = 
        '.table-wrapper { max-height: none !important; overflow: visible !important; }' +
        '.table th { position: static !important; }';
    document.head.appendChild(printStyles);
    
    html2pdf().set({
        margin: [10, 10, 10, 10],
        filename: 'Распределение_' + (currentGroupData ? currentGroupData.name : 'группа') + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    }).from(el).save().then(function() {
        btn.innerHTML = '📄 Экспорт в PDF';
        btn.disabled = false;
        document.head.removeChild(printStyles);
        showToast('✅ PDF готов');
    }).catch(function(err) { 
        console.error(err);
        btn.innerHTML = '📄 Экспорт в PDF'; 
        btn.disabled = false;
        document.head.removeChild(printStyles);
        showToast('❌ Ошибка PDF', 'error');
    });
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
function bindPageHandlers() {
    document.getElementById('exportWordBtn').onclick = exportToWord;
    document.getElementById('exportWordBtnBottom').onclick = exportToWord;
    document.getElementById('exportPdfBtn').onclick = exportToPDF;
    document.getElementById('exportPdfBtnBottom').onclick = exportToPDF;

    document.getElementById('groupSelect').addEventListener('change', function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearchBtn').classList.remove('visible');
        loadDistribution();
    });

    bindSearch();
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init() {
    console.log('🔧 Инициализация distribution.html...');
    
    if (window.Session && typeof window.Session.init === 'function') {
        try {
            var sessionOk = await window.Session.init();
            if (sessionOk === false) return;
        } catch (e) {
            console.warn('⚠️ Session.init() ошибка:', e);
        }
    }

    sb = getSupabaseClient();
    if (!sb) {
        console.error('❌ Не удалось получить клиент Supabase');
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    waitForHeaderAndSidebar(function() {
        bindHeaderButtons();
        bindPageHandlers();
        
        loadUser().then(function(ok) {
            if (ok === false) return;
            loadGroups();
        });
    });
}

function boot() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
}

boot();
</script>
