<script>
// ============================================================

var sb = null;

// ============================================================
// ЖДЁМ ОТРИСОВКИ ШАПКИ (header.js / sidebar.js)
// ============================================================
function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) {
        callback();
        return;
    }
    if (attempts > 100) {
        console.warn('⚠️ Шапка/сайдбар так и не отрисовались, продолжаем всё равно');
        callback();
        return;
    }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) { window.location.href = '/'; return false; }
        try { user = JSON.parse(savedUser); } catch (e) {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
            return false;
        }
    }
    currentUser = user;
    hasEditRights = user.role === 'super_admin' || user.role === 'admin';
    
    waitForHeaderAndSidebar(function() {
        var nameEl = document.getElementById('userNameDisplay');
        var roleEl = document.getElementById('userRoleDisplay');
        if (nameEl) nameEl.textContent = user.name || user.full_name || user.login;
        var roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
        if (roleEl) roleEl.textContent = roleMap[user.role] || user.role;
    });
    return true;
}

// ============================================================
// ФУНКЦИИ ФОРМАТИРОВАНИЯ
// ============================================================
function formatDate(dateStr) {
    if (!dateStr) return '—';
    var d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateFull(dateStr) {
    if (!dateStr) return '—';
    var d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function getTypeLabel(type) {
    return type === 'sso' ? 'ССО' : 'ПТО';
}

function getTypeBadge(type) {
    return type === 'sso' ? 'badge-sso' : 'badge-pto';
}

function getGenderLabel(gender) {
    if (gender === 'male') return 'Мужской';
    if (gender === 'female') return 'Женский';
    return gender || '—';
}

function calculateAge(birthDate) {
    if (!birthDate) return '—';
    var birth = new Date(birthDate);
    var today = new Date();
    var age = today.getFullYear() - birth.getFullYear();
    var m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age;
}

function formatGrade(value) {
    if (value === null || value === undefined || value === '') return '—';
    var num = parseFloat(value);
    if (isNaN(num)) return '—';
    return num.toFixed(1).replace('.', ',');
}

function getMaxCourse(type) {
    return type === 'sso' ? 4 : 3;
}

function calculateTotalAverage(student) {
    if (!student) return null;
    var type = student.type || 'pto';
    var maxCourse = getMaxCourse(type);
    
    var grades = [];
    for (var course = 1; course <= maxCourse; course++) {
        var year = student['grade_' + course + '_year'];
        if (year !== null && year !== undefined && year !== '') {
            var num = parseFloat(year);
            if (!isNaN(num) && num >= 0 && num <= 10) {
                grades.push(num);
            }
        }
    }
    
    if (grades.length === 0) return null;
    var sum = 0;
    for (var i = 0; i < grades.length; i++) sum += grades[i];
    var avg = sum / grades.length;
    return Math.ceil(avg * 10) / 10;
}

// ============================================================
// ЗАГРУЗКА ОТЧИСЛЕННЫХ
// ============================================================
async function loadStudents() {
    var container = document.getElementById('studentsContainer');
    var typeFilter = document.getElementById('typeFilter').value;
    var yearFilter = document.getElementById('yearFilter').value;
    var search = document.getElementById('searchInput').value.toLowerCase().trim();

    if (!sb) {
        container.innerHTML = '<div class="empty-state"><span class="icon">❌</span><h3>Ошибка подключения</h3></div>';
        return;
    }

    try {
        var result = await sb
            .from('expelled_students')
            .select('*')
            .order('full_name');

        if (result.error) throw result.error;

        allStudents = result.data || [];

        var filtered = allStudents;

        if (typeFilter !== 'all') {
            filtered = filtered.filter(function(s) { return s.type === typeFilter; });
        }

        if (yearFilter !== 'all') {
            filtered = filtered.filter(function(s) {
                if (s.expulsion_date) {
                    return new Date(s.expulsion_date).getFullYear().toString() === yearFilter;
                }
                return false;
            });
        }

        if (search) {
            filtered = filtered.filter(function(s) { 
                return s.full_name.toLowerCase().indexOf(search) !== -1;
            });
        }

        updateStats(allStudents);

        if (filtered.length === 0) {
            container.innerHTML = 
                '<div class="empty-state">' +
                    '<span class="icon">📭</span>' +
                    '<h3>Нет отчисленных студентов</h3>' +
                    '<p style="color:var(--text-muted);">Студенты, отчисленные из колледжа, появятся здесь</p>' +
                '</div>';
            loadYearsFilter(allStudents);
            return;
        }

        var yearMap = {};
        filtered.forEach(function(s) {
            var year = s.expulsion_date ? new Date(s.expulsion_date).getFullYear().toString() : '—';
            if (!yearMap[year]) yearMap[year] = [];
            yearMap[year].push(s);
        });

        var sortedYears = Object.keys(yearMap).sort(function(a, b) {
            if (a === '—') return 1;
            if (b === '—') return -1;
            return parseInt(b) - parseInt(a);
        });

        var html = '';

        sortedYears.forEach(function(year) {
            var students = yearMap[year];
            
            html += 
                '<div class="year-block">' +
                    '<div class="year-header" onclick="toggleYear(this)">' +
                        '<span class="year-label">📅 ' + year + ' год</span>' +
                        '<span class="year-count">(' + students.length + ' чел.)</span>' +
                        '<span class="arrow">▶</span>' +
                    '</div>' +
                    '<div class="students-grid hidden">';

            students.forEach(function(s, index) {
                var typeLabel = getTypeLabel(s.type);
                var typeBadge = getTypeBadge(s.type);
                var totalAvg = calculateTotalAverage(s);
                var avgDisplay = totalAvg !== null ? totalAvg.toFixed(1).replace('.', ',') : '—';

                html += 
                    '<div class="student-card" onclick="viewStudent(\'' + s.id + '\')">' +
                        '<div class="student-info">' +
                            '<div class="student-name">' + (index + 1) + '. ' + s.full_name + '</div>' +
                            '<div class="student-details">' +
                                '<span class="badge-type ' + typeBadge + '">' + typeLabel + '</span>' +
                                (s.group_name ? ' • Группа: ' + s.group_name : '') +
                                (s.expulsion_date ? ' • Отчислен: ' + formatDate(s.expulsion_date) : '') +
                                (avgDisplay !== '—' ? ' • 📊 ' + avgDisplay : '') +
                            '</div>' +
                        '</div>' +
                        '<div class="student-actions">' +
                            '<button class="btn btn-info btn-xs" onclick="event.stopPropagation();viewStudent(\'' + s.id + '\')">👁️</button>' +
                            (hasEditRights ? '<button class="btn btn-restore btn-xs" onclick="event.stopPropagation();restoreStudent(\'' + s.id + '\')">🔄</button>' : '') +
                        '</div>' +
                    '</div>';
            });

            html += 
                    '</div>' +
                '</div>';
        });

        container.innerHTML = html;
        loadYearsFilter(allStudents);

    } catch (error) {
        console.error('❌ Ошибка загрузки:', error);
        container.innerHTML = 
            '<div class="empty-state">' +
                '<span class="icon">❌</span>' +
                '<h3>Ошибка загрузки</h3>' +
                '<p style="color:var(--text-muted);">' + error.message + '</p>' +
            '</div>';
        showToast('❌ Ошибка загрузки: ' + error.message, 'error');
    }
}

function updateStats(students) {
    var total = students.length;
    var sso = students.filter(function(s) { return s.type === 'sso'; }).length;
    var pto = students.filter(function(s) { return s.type === 'pto'; }).length;
    var groupNames = {};
    students.forEach(function(s) { if (s.group_name) groupNames[s.group_name] = true; });
    var groups = Object.keys(groupNames);

    document.getElementById('totalCount').textContent = total;
    document.getElementById('ssoCount').textContent = sso;
    document.getElementById('ptoCount').textContent = pto;
    document.getElementById('groupsCount').textContent = groups.length;
}

function loadYearsFilter(students) {
    var select = document.getElementById('yearFilter');
    var years = {};
    students.forEach(function(s) {
        if (s.expulsion_date) {
            years[new Date(s.expulsion_date).getFullYear().toString()] = true;
        }
    });
    var sortedYears = Object.keys(years).sort(function(a, b) { return parseInt(b) - parseInt(a); });

    var currentValue = select.value;
    select.innerHTML = '<option value="all">Все годы</option>';
    sortedYears.forEach(function(year) {
        select.innerHTML += '<option value="' + year + '">' + year + '</option>';
    });
    select.value = currentValue;
}

function toggleYear(header) {
    var content = header.nextElementSibling;
    var arrow = header.querySelector('.arrow');
    if (content) {
        content.classList.toggle('hidden');
        if (arrow) arrow.classList.toggle('open');
    }
}

// ============================================================
// ПРОСМОТР КАРТОЧКИ
// ============================================================
async function viewStudent(id) {
    if (!sb) return;
    try {
        var result = await sb
            .from('expelled_students')
            .select('*')
            .eq('id', id)
            .single();

        if (result.error || !result.data) {
            showToast('❌ Запись не найдена', 'error');
            return;
        }

        var student = result.data;
        currentStudentId = id;

        var birthDate = student.birth_date ? formatDateFull(student.birth_date) : '—';
        var age = student.birth_date ? calculateAge(student.birth_date) : '—';
        var genderLabel = getGenderLabel(student.gender);
        var totalAvg = calculateTotalAverage(student);
        var avgDisplay = totalAvg !== null ? totalAvg.toFixed(1).replace('.', ',') : '—';

        var type = student.type || 'pto';
        var maxCourse = getMaxCourse(type);
        var gradesHtml = '';
        
        for (var course = 1; course <= maxCourse; course++) {
            var sem1 = student['grade_' + course + '_sem1'];
            var sem2 = student['grade_' + course + '_sem2'];
            var year = student['grade_' + course + '_year'];
            if (sem1 || sem2 || year) {
                gradesHtml += 
                    '<div class="info-item">' +
                        '<span class="label">📘 ' + course + ' курс</span>' +
                        '<span class="value">' +
                            '1 сем: ' + formatGrade(sem1) + ' | 2 сем: ' + formatGrade(sem2) + ' | <strong>год: ' + formatGrade(year) + '</strong>' +
                        '</span>' +
                    '</div>';
            }
        }

        var modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = 
            '<div class="student-full-card">' +
                '<div class="name">' + student.full_name + '</div>' +
                '<div class="sub">' +
                    '<span style="font-weight:600;color:var(--danger);">❌ Отчислен</span> ' +
                    '<span class="badge-type ' + getTypeBadge(student.type) + '">' + getTypeLabel(student.type) + '</span>' +
                    (student.group_name ? ' • Группа: ' + student.group_name : '') +
                    (avgDisplay !== '—' ? ' • 📊 <strong>Средний балл: ' + avgDisplay + '</strong>' : '') +
                '</div>' +
                '<hr style="margin:12px 0;border-color:var(--border);">' +
                
                '<div class="expulsion-info">' +
                    '<strong>📄 Информация об отчислении</strong><br>' +
                    '<strong>Дата:</strong> ' + formatDateFull(student.expulsion_date) + '<br>' +
                    '<strong>Приказ:</strong> ' + (student.expulsion_order || '—') + '<br>' +
                    '<strong>Статья:</strong> ' + (student.expulsion_article || '—') +
                '</div>' +
                
                '<div class="info-grid">' +
                    '<div class="info-item"><span class="label">📅 Дата рождения</span><span class="value">' + birthDate + ' (' + age + ' лет)</span></div>' +
                    '<div class="info-item"><span class="label">📱 Телефон</span><span class="value">' + (student.phone || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">🧑‍🤝‍🧑 Пол</span><span class="value">' + genderLabel + '</span></div>' +
                    '<div class="info-item"><span class="label">🌍 Гражданство</span><span class="value">' + (student.citizenship || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📊 Средний балл аттестата</span><span class="value">' + formatGrade(student.avg_grade) + '</span></div>' +
                    '<div class="info-item"><span class="label">🏫 Школа</span><span class="value">' + (student.school || '—') + ' ' + (student.school_year ? '(' + student.school_year + ' г.)' : '') + '</span></div>' +
                    '<div class="info-item"><span class="label">📚 Класс</span><span class="value">' + (student.school_class || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📍 Адрес регистрации</span><span class="value">' + (student.address_reg || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📍 Адрес проживания</span><span class="value">' + (student.address_live || '—') + '</span></div>' +
                    (student.lives_in_dorm ? 
                    '<div class="info-item" style="grid-column:1/-1;background:#F0F9FF;padding:8px 12px;border-radius:var(--border-radius);border:1px solid #7DD3FC;">' +
                        '<span class="label">🏠 Общежитие</span>' +
                        '<span class="value">' +
                            '<strong>Блок:</strong> ' + (student.dorm_block || '—') + ' | ' +
                            '<strong>Комната:</strong> ' + (student.dorm_room_type || '—') + ' | ' +
                            '<strong>Заселён:</strong> ' + (student.dorm_check_in ? formatDateFull(student.dorm_check_in) : '—') +
                            (student.dorm_check_out ? ' | <strong>Выселен:</strong> ' + formatDateFull(student.dorm_check_out) : '') +
                        '</span>' +
                    '</div>' : '') +
                    '<div class="info-item"><span class="label">📌 Область</span><span class="value">' + (student.address_region || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📌 Район</span><span class="value">' + (student.address_district || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📌 Населённый пункт</span><span class="value">' + (student.address_locality || '—') + '</span></div>' +
                    '<div class="info-item"><span class="label">📋 Учёт</span><span class="value">' + (function() {
                        var accData = (student.accounting_data && Array.isArray(student.accounting_data)) ? student.accounting_data.slice() : [];
                        var accTypes = student.accounting_type || [];
                        if (accTypes.includes('НГЗ') && !accData.some(function(x) { return x.type === 'НГЗ'; })) {
                            accData.push({ type: 'НГЗ', start: '', end: '' });
                        }
                        if (accData.length === 0 && accTypes.length > 0) {
                            return accTypes.join(', ');
                        }
                        return accData.length > 0 ? accData.map(function(a) { 
                            var s = a.type;
                            if (a.start) s += ' (с ' + formatDateFull(a.start) + ')';
                            if (a.end) s += ' — ' + formatDateFull(a.end);
                            return s;
                        }).join(', ') : '—';
                    })() + '</span></div>' +
                    (student.target_training ? 
                    '<div class="info-item" style="grid-column:1/-1;background:#F0FDF4;padding:8px 12px;border-radius:var(--border-radius);border:1px solid #86EFAC;">' +
                        '<span class="label">🎯 Целевое обучение</span>' +
                        '<span class="value">' +
                            '<strong>Заказчик:</strong> ' + (student.target_customer || '—') + ' | ' +
                            '<strong>№ договора:</strong> ' + (student.target_contract || '—') + ' | ' +
                            '<strong>Срок:</strong> ' + (student.target_years ? student.target_years + ' лет' : '—') +
                        '</span>' +
                    '</div>' : '') +
                    gradesHtml +
                    '<div class="info-item"><span class="label">📅 Дата записи</span><span class="value">' + formatDateFull(student.created_at) + '</span></div>' +
                '</div>' +
            '</div>';

        var restoreBtn = document.getElementById('restoreBtn');
        if (hasEditRights) {
            restoreBtn.style.display = 'inline-flex';
            restoreBtn.onclick = function() {
                document.getElementById('studentModal').classList.remove('active');
                restoreStudent(id);
            };
        } else {
            restoreBtn.style.display = 'none';
        }

        document.getElementById('studentModal').classList.add('active');

    } catch (error) {
        console.error('❌ Ошибка загрузки:', error);
        showToast('❌ Ошибка загрузки: ' + error.message, 'error');
    }
}

// ============================================================
// ВОССТАНОВЛЕНИЕ
// ============================================================
async function restoreStudent(id) {
    if (!hasEditRights) {
        showToast('❌ У вас нет прав на восстановление', 'error');
        return;
    }

    if (!confirm('🔄 Восстановить этого студента?')) return;

    try {
        var result = await sb
            .from('expelled_students')
            .select('*')
            .eq('id', id)
            .single();

        var student = result.data;
        if (!student) {
            showToast('❌ Студент не найден', 'error');
            return;
        }

        var studentData = {
            full_name: student.full_name,
            group_id: student.group_id,
            birth_date: student.birth_date || null,
            phone: student.phone || null,
            citizenship: student.citizenship || null,
            school: student.school || null,
            school_year: student.school_year || null,
            school_class: student.school_class || null,
            avg_grade: student.avg_grade || null,
            gender: student.gender || null,
            address_reg: student.address_reg || null,
            address_live: student.address_live || null,
            address_region: student.address_region || null,
            address_district: student.address_district || null,
            address_locality: student.address_locality || null,
            accounting_type: student.accounting_type || [],
            addresses: student.addresses || [],
            target_training: student.target_training || false,
            target_customer: student.target_customer || null,
            target_contract: student.target_contract || null,
            target_years: student.target_years || null,
            status: 'active',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        };

        var maxCourse = getMaxCourse(student.type || 'pto');
        for (var course = 1; course <= maxCourse; course++) {
            studentData['grade_' + course + '_sem1'] = student['grade_' + course + '_sem1'] || null;
            studentData['grade_' + course + '_sem2'] = student['grade_' + course + '_sem2'] || null;
            studentData['grade_' + course + '_year'] = student['grade_' + course + '_year'] || null;
        }

        await sb.from('students').insert([studentData]);
        await sb.from('expelled_students').delete().eq('id', id);

        showToast('✅ Студент ' + student.full_name + ' восстановлен!', 'success');
        loadStudents();

    } catch (error) {
        console.error('❌ Ошибка восстановления:', error);
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

// ============================================================
// ЭКСПОРТ В EXCEL
// ============================================================
function bindExportButton() {
    document.getElementById('exportBtn').onclick = function() {
        if (allStudents.length === 0) {
            showToast('❌ Нет данных для экспорта', 'error');
            return;
        }

        var exportData = allStudents.map(function(s) {
            return {
                'ФИО': s.full_name,
                'Группа': s.group_name || '—',
                'Тип': getTypeLabel(s.type),
                'Дата отчисления': s.expulsion_date ? formatDateFull(s.expulsion_date) : '—',
                'Приказ': s.expulsion_order || '—',
                'Статья': s.expulsion_article || '—',
                'Телефон': s.phone || '—',
                'Средний балл': s.avg_grade || '—'
            };
        });

        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.json_to_sheet(exportData);
        ws['!cols'] = [{ wch: 30 }, { wch: 15 }, { wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 20 }, { wch: 20 }, { wch: 12 }];
        XLSX.utils.book_append_sheet(wb, ws, 'Отчисленные');
        XLSX.writeFile(wb, 'Отчисленные_' + new Date().toISOString().slice(0, 10) + '.xlsx');
        showToast('✅ Экспортировано ' + exportData.length + ' записей', 'success');
    };
}

// ============================================================
// МОДАЛЬНОЕ ОКНО
// ============================================================
function closeModal() {
    document.getElementById('studentModal').classList.remove('active');
}

function bindPageHandlers() {
    document.getElementById('typeFilter').addEventListener('change', loadStudents);
    document.getElementById('yearFilter').addEventListener('change', loadStudents);
    document.getElementById('searchInput').addEventListener('input', loadStudents);

    document.getElementById('clearFiltersBtn').onclick = function() {
        document.getElementById('typeFilter').value = 'all';
        document.getElementById('yearFilter').value = 'all';
        document.getElementById('searchInput').value = '';
        loadStudents();
    };

    document.getElementById('modalCloseBtn').onclick = closeModal;
    document.getElementById('modalCancelBtn').onclick = closeModal;
    document.getElementById('studentModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    bindExportButton();
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init() {
    if (window.Session && typeof window.Session.init === 'function') {
        try {
            var sessionOk = await window.Session.init();
            if (sessionOk === false) return;
        } catch (e) {
            console.warn('⚠️ Session.init() ошибка:', e);
        }
    }

    sb = getSupabaseClient();
    if (!sb) {
        console.error('❌ Не удалось получить клиент Supabase');
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    waitForHeaderAndSidebar(function() {
        bindHeaderButtons();
        bindPageHandlers();
        
        loadUser().then(function(ok) {
            if (ok === false) return;
            loadStudents();
        });
    });
}

function boot() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
}

boot();
</script>
