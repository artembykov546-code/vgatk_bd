    <style>
        /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ===== */
        .page-container { max-width: 1400px; margin: 0 auto; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--primary); }
        .page-title small { font-weight: 400; font-size: 14px; color: var(--text-muted); }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .group-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .info-card { background: var(--bg-card); padding: 12px 16px; border-radius: var(--border-radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .info-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .info-card .value { font-size: 16px; font-weight: 600; color: var(--primary); margin-top: 2px; }

        .badge-type { padding: 2px 12px; border-radius: 12px; font-weight: 500; font-size: 13px; }
        .badge-sso { background: #D6EAF8; color: #1A5276; }
        .badge-pto { background: #FDEBD0; color: #7E5109; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .tag-item { background: var(--bg-main); padding: 1px 10px; border-radius: 12px; font-size: 12px; border: 1px solid var(--border); }

        .table-container { overflow-x: auto; border-radius: var(--border-radius-lg); border: 1px solid var(--border); background: var(--bg-card); }
        .table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table thead { background: var(--bg-main); }
        .table th { padding: 8px 12px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); font-size: 12px; white-space: nowrap; }
        .table td { padding: 6px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
        .table tbody tr:hover { background: rgba(44, 62, 143, 0.04); }
        .table .student-link { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; }
        .table .student-link:hover { text-decoration: underline; }

        .gender-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-left: 6px; }
        .gender-male { background: #DBEAFE; color: #1E40AF; }
        .gender-female { background: #FCE4EC; color: #C62828; }

        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
        .status-active { background: #D1FAE5; color: #065F46; }
        .status-inactive { background: #FEE2E2; color: #991B1B; }
        .status-graduated { background: #E2E8F0; color: #475569; }
        .status-academic { background: #FEF3C7; color: #92400E; }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .error-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .error-state .icon { font-size: 64px; display: block; margin-bottom: 16px; }
        .error-state h3 { font-size: 20px; color: var(--text-primary); margin-bottom: 8px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: var(--border-radius-xl); padding: 28px; max-width: 700px; width: 95%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-modal); animation: slideUp 0.3s ease; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
        .modal-title { font-size: 20px; font-weight: 700; color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-muted); transition: var(--transition); line-height: 1; }
        .modal-close:hover { color: var(--danger); transform: rotate(90deg); }
        .modal-body { padding: 6px 0 16px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; padding-top: 12px; border-top: 2px solid var(--border); }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-weight: 600; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-label .required { color: var(--danger); margin-left: 2px; }
        .form-control { width: 100%; padding: 8px 12px; border: 2px solid var(--border); border-radius: var(--border-radius); font-size: 13px; transition: var(--transition); background: var(--bg-card); }
        .form-control:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(44, 62, 143, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .tag-input-group { display: flex; gap: 6px; margin-top: 4px; }
        .tag-input-group input { flex: 1; padding: 6px 10px; border: 2px solid var(--border); border-radius: var(--border-radius); font-size: 12px; transition: var(--transition); background: var(--bg-card); }

        .btn-sm { padding: 4px 12px; font-size: 11px; }
        .btn-xs { padding: 2px 8px; font-size: 10px; border-radius: 6px; }
        .readonly-badge { display: inline-block; background: #F1F5F9; color: #64748B; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 500; border: 1px solid #E2E8F0; }
        .table-actions { display: flex; gap: 4px; flex-wrap: wrap; }

        .btn-export-pdf { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: white; }
        .btn-export-pdf:hover { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); }

        .toast-notification { position: fixed; top: 80px; right: 20px; padding: 14px 20px; border-radius: var(--border-radius); color: white; font-weight: 600; z-index: 9999; animation: slideUp 0.3s ease; max-width: 400px; box-shadow: var(--shadow-modal); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-notification .toast-close { float: right; margin-left: 14px; cursor: pointer; font-size: 16px; opacity: 0.8; }
        .toast-notification .toast-close:hover { opacity: 1; }

        .chart-container { background: var(--bg-card); border-radius: var(--border-radius-xl); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-top: 20px; }
        .chart-container h3 { font-size: 17px; font-weight: 600; color: var(--primary); margin-bottom: 12px; text-align: center; }
        .chart-container .chart-wrapper { max-width: 100%; height: 400px; position: relative; }
        .chart-container .chart-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .chart-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
        .chart-tabs button { padding: 4px 14px; border: 2px solid var(--border); border-radius: var(--border-radius); background: var(--bg-card); cursor: pointer; font-size: 12px; font-weight: 500; transition: var(--transition); color: var(--text-secondary); }
        .chart-tabs button:hover { border-color: var(--primary-light); color: var(--primary); }
        .chart-tabs button.active { background: var(--primary); color: white; border-color: var(--primary); }
        .ranking-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; padding: 6px 10px; background: var(--bg-main); border-radius: var(--border-radius); }
        .ranking-legend .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); }
        .ranking-legend .legend-item .color-box { width: 14px; height: 14px; border-radius: 4px; }

<script>
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
var sb = null;
var urlParams = new URLSearchParams(window.location.search);
var groupId = urlParams.get('id');
var currentUser = null;
var currentGroup = null;
var hasEditRights = false;
var chartInstance = null;
var studentsData = [];
var activeCourse = 1;
var staffData = { curators: [], masters: [] };

var editSpecialties = [];
var editQualifications = [];

// ============================================================
// ЖДЁМ ОТРИСОВКИ ШАПКИ (header.js / sidebar.js)
// ============================================================
function waitForHeaderAndSidebar(callback, attempts) {
    attempts = attempts || 0;
    var header = document.querySelector('header.header');
    var sidebar = document.getElementById('sidebar');
    var hasHeaderContent = header && (header.innerHTML.trim().length > 0 || header.children.length > 0);
    var hasSidebarContent = sidebar && (sidebar.innerHTML.trim().length > 0 || sidebar.children.length > 0);

    if (hasHeaderContent && hasSidebarContent) {
        callback();
        return;
    }
    if (attempts > 100) {
        console.warn('⚠️ Шапка/сайдбар так и не отрисовались, продолжаем всё равно');
        callback();
        return;
    }
    setTimeout(function() { waitForHeaderAndSidebar(callback, attempts + 1); }, 100);
}

// ============================================================
// ПОЛУЧЕНИЕ КЛИЕНТА SUPABASE
// ============================================================
function getSupabaseClient() {
    if (window.Session && typeof window.Session.supabase === 'function') {
        var client = window.Session.supabase();
        if (client) return client;
    }
    if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
        return window.supabaseClient;
    }
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        var client = window.supabase.createClient(
            'https://selbolepupendprhixas.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlbGJvbGVwdXBlbmRwcmhpeGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjQzODgsImV4cCI6MjA5ODE0MDM4OH0.UpWEr6hEs9ytnDxnaQ7Uf3d_xDQLHO-eejkIw53o7EE'
        );
        window.supabaseClient = client;
        return client;
    }
    return null;
}

// ============================================================
// ФУНКЦИЯ ДЛЯ ГЕНЕРАЦИИ СЛУЧАЙНЫХ ЦВЕТОВ
// ============================================================
function generateRandomColors(count) {
    var colors = [];
    for (var i = 0; i < count; i++) {
        var hue = Math.floor(Math.random() * 360);
        var saturation = 60 + Math.floor(Math.random() * 35);
        var lightness = 45 + Math.floor(Math.random() * 30);
        colors.push('hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)');
    }
    return colors;
}

// ============================================================
// TOAST УВЕДОМЛЕНИЯ
// ============================================================
function showToast(message, type) {
    type = type || 'success';
    var existing = document.querySelector('.toast-notification');
    if (existing) existing.remove();
    
    var toast = document.createElement('div');
    toast.className = 'toast-notification toast-' + type;
    toast.innerHTML = '<span class="toast-close" onclick="this.parentElement.remove()">×</span>' + message;
    document.body.appendChild(toast);
    
    setTimeout(function() {
        if (toast.parentElement) toast.remove();
    }, 5000);
}

// ============================================================
// ПОЛЬЗОВАТЕЛЬ
// ============================================================
async function loadUser() {
    var user = window.Session ? window.Session.getUser() : null;
    
    if (!user) {
        var savedUser = localStorage.getItem('currentUser');
        if (!savedUser) { window.location.href = '/'; return; }
        try { currentUser = JSON.parse(savedUser); } catch (e) {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
            return;
        }
    } else {
        currentUser = user;
    }
    
    waitForHeaderAndSidebar(function() {
        var nameEl = document.getElementById('userNameDisplay');
        var roleEl = document.getElementById('userRoleDisplay');
        if (nameEl) nameEl.textContent = currentUser.name || currentUser.full_name || currentUser.login;
        var roleMap = { 'super_admin': 'Супер-Админ', 'admin': 'Администратор', 'teacher': 'Преподаватель', 'master': 'Мастер ПО', 'viewer': 'Наблюдатель' };
        if (roleEl) roleEl.textContent = roleMap[currentUser.role] || currentUser.role;
    });
}

function bindHeaderButtons() {
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn && !logoutBtn.__bound) {
        logoutBtn.__bound = true;
        logoutBtn.onclick = function() {
            if (window.Session && typeof window.Session.logout === 'function') {
                window.Session.logout();
            } else {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            }
        };
    }
    var menuToggle = document.getElementById('menuToggle');
    if (menuToggle && !menuToggle.__bound) {
        menuToggle.__bound = true;
        menuToggle.onclick = function() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        };
        if (window.innerWidth > 768) {
            menuToggle.style.display = 'none';
        } else {
            menuToggle.style.display = 'inline-block';
        }
    }
}

// ============================================================
// ФУНКЦИИ ДЛЯ ТЕГОВ В МОДАЛКЕ
// ============================================================
function addEditSpecialty() {
    var input = document.getElementById('editSpecialtyInput');
    var value = input.value.trim();
    if (!value) return;
    if (editSpecialties.includes(value)) { showToast('❌ Эта специальность уже добавлена', 'error'); return; }
    editSpecialties.push(value);
    input.value = '';
    renderEditTags('editSpecialtyList', editSpecialties, 'specialty');
}
function addEditQualification() {
    var input = document.getElementById('editQualificationInput');
    var value = input.value.trim();
    if (!value) return;
    if (editQualifications.includes(value)) { showToast('❌ Эта квалификация уже добавлена', 'error'); return; }
    editQualifications.push(value);
    input.value = '';
    renderEditTags('editQualificationList', editQualifications, 'qualification');
}
function removeEditTag(containerId, item, type) {
    if (type === 'specialty') { editSpecialties = editSpecialties.filter(function(s) { return s !== item; }); renderEditTags('editSpecialtyList', editSpecialties, 'specialty'); } 
    else if (type === 'qualification') { editQualifications = editQualifications.filter(function(q) { return q !== item; }); renderEditTags('editQualificationList', editQualifications, 'qualification'); }
}
function renderEditTags(containerId, items, type) {
    var container = document.getElementById(containerId);
    if (!container) return;
    if (items.length === 0) {
        var labels = { 'specialty': 'специальностей', 'qualification': 'квалификаций' };
        container.innerHTML = '<span class="empty-tags" style="color:var(--text-muted);font-size:12px;">Нет добавленных ' + (labels[type] || 'элементов') + '</span>';
        return;
    }
    container.innerHTML = items.map(function(item) {
        var safeItem = String(item).replace(/'/g, "\\'");
        return '<span class="tag-item">' + item + '<span class="remove-tag" onclick="removeEditTag(\'' + containerId + '\', \'' + safeItem + '\', \'' + type + '\')" style="cursor:pointer;color:var(--danger);font-weight:700;margin-left:4px;">×</span></span>';
    }).join('');
}

// ============================================================
// ФУНКЦИИ ФОРМАТИРОВАНИЯ
// ============================================================
function formatDate(dateStr) { 
    if (!dateStr) return '—'; 
    return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); 
}
function calculateAge(birthDate) {
    if (!birthDate) return '—';
    var birth = new Date(birthDate); var today = new Date();
    var age = today.getFullYear() - birth.getFullYear();
    var m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age;
}
function getStatusBadge(status) { 
    if (status === 'active') return 'status-active';
    if (status === 'graduated') return 'status-graduated';
    if (status === 'academic') return 'status-academic';
    return 'status-inactive'; 
}
function getStatusText(status) { 
    if (status === 'active') return '✅ Активен';
    if (status === 'graduated') return '🎓 Выпущен';
    if (status === 'academic') return '📚 Академ. отпуск';
    return '❌ Неактивен'; 
}
function getGenderBadge(gender) {
    if (gender === 'Мужской') return '<span class="gender-badge gender-male">👨 М</span>';
    if (gender === 'Женский') return '<span class="gender-badge gender-female">👩 Ж</span>';
    return '';
}
function formatGradeForChart(value) {
    if (value === null || value === undefined || value === '') return null;
    var num = parseFloat(value);
    if (isNaN(num)) return null;
    return num;
}
function getCourseData(student, course) {
    var sem1 = student['grade_' + course + '_sem1'];
    var sem2 = student['grade_' + course + '_sem2'];
    var year = student['grade_' + course + '_year'];
    return { sem1: formatGradeForChart(sem1), sem2: formatGradeForChart(sem2), year: formatGradeForChart(year) };
}

async function loadStaffFromEmployees(groupType) {
    var result = await sb
        .from('employees')
        .select('id, full_name, category, groups')
        .eq('is_hidden', false);

    if (result.error || !result.data) return { curators: [], masters: [] };

    var employees = result.data;

    var assignedCurators = employees.filter(function(e) {
        return e.category === 'teachers' && Array.isArray(e.groups) && e.groups.includes(groupId);
    }).map(function(e) { return e.full_name; });

    var assignedMasters = employees.filter(function(e) {
        return e.category === 'masters' && Array.isArray(e.groups) && e.groups.includes(groupId);
    }).map(function(e) { return e.full_name; });

    return { curators: assignedCurators, masters: assignedMasters };
}

async function checkEditRights(staff) {
    if (!currentUser || !currentGroup) return false;
    if (currentUser.role === 'super_admin' || currentUser.role === 'admin') return true;

    try {
        var userResult = await sb.from('users').select('employee_id').eq('id', currentUser.id).single();
        if (!userResult.data || !userResult.data.employee_id) return false;

        var employeeResult = await sb.from('employees').select('full_name').eq('id', userResult.data.employee_id).single();
        if (!employeeResult.data) return false;

        var employeeName = employeeResult.data.full_name;

        if (staff.curators.includes(employeeName)) return true;
        if (currentGroup.type === 'pto' && staff.masters.includes(employeeName)) return true;

        return false;
    } catch (error) {
        console.error('❌ Ошибка проверки прав:', error);
        return false;
    }
}

async function deleteStudent(studentId) {
    if (!hasEditRights) return;
    
    var studentResult = await sb.from('students').select('full_name, status, group_id').eq('id', studentId).single();
    var student = studentResult.data;
    
    if (!student) { showToast('❌ Студент не найден', 'error'); return; }
    
    if (student.status === 'graduated') {
        showToast('❌ Нельзя удалить выпускника. Удалите его из раздела "Выпускники"', 'error');
        return;
    }
    if (student.status === 'academic') {
        showToast('❌ Студент в академическом отпуске', 'error');
        return;
    }

    if (!confirm('🗑️ Вы уверены, что хотите полностью удалить студента "' + student.full_name + '"?\n\nЭто действие нельзя отменить! Все данные о студенте будут удалены.')) return;

    try {
        await sb.from('student_parents').delete().eq('student_id', studentId);
        await sb.from('student_siblings').delete().eq('student_id', studentId);
        
        var deleteResult = await sb.from('students').delete().eq('id', studentId);
        if (deleteResult.error) throw deleteResult.error;
        
        showToast('✅ Студент "' + student.full_name + '" полностью удалён из базы данных', 'success');
        await loadStudents();
    } catch (error) {
        console.error('❌ Ошибка удаления:', error);
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

function renderChart(students) {
    var container = document.getElementById('chartContainer');
    var tabsContainer = document.getElementById('chartTabs');
    
    var activeStudents = students.filter(function(s) { return s.status === 'active'; });
    
    if (activeStudents.length === 0) {
        container.style.display = 'none';
        return;
    }

    container.style.display = 'block';
    
    var maxCourse = currentGroup.type === 'sso' ? 4 : 3;
    
    var tabsHtml = '';
    for (var course = 1; course <= maxCourse; course++) {
        tabsHtml += '<button class="' + (course === 1 ? 'active' : '') + '" data-course="' + course + '">' + course + ' курс</button>';
    }
    tabsContainer.innerHTML = tabsHtml;
    
    activeCourse = 1;
    
    document.querySelectorAll('#chartTabs button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#chartTabs button').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            var course = parseInt(this.dataset.course);
            activeCourse = course;
            updateChartData(activeStudents, course);
        });
    });
    
    initChart(activeStudents, 1);
}

function initChart(students, course) {
    var ctx = document.getElementById('gradesChart').getContext('2d');
    
    if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
    }
    
    var courseData = students.map(function(s) {
        var data = getCourseData(s, course);
        return { name: s.full_name, sem1: data.sem1, sem2: data.sem2, year: data.year, student: s };
    });
    
    var validStudents = courseData.filter(function(s) { return s.sem1 !== null || s.sem2 !== null || s.year !== null; });
    
    if (validStudents.length === 0) {
        document.getElementById('chartContainer').style.display = 'none';
        return;
    }
    
    var sortedForDisplay = validStudents.slice().sort(function(a, b) {
        var yearA = a.year !== null ? a.year : -Infinity;
        var yearB = b.year !== null ? b.year : -Infinity;
        if (yearB !== yearA) return yearB - yearA;
        return a.name.localeCompare(b.name);
    });
    
    var studentColors = generateRandomColors(sortedForDisplay.length);
    
    var legendContainer = document.getElementById('rankingLegend');
    var legendHtml = '';
    sortedForDisplay.forEach(function(s, index) {
        var genderIcon = s.student && s.student.gender === 'Мужской' ? '👨' : (s.student && s.student.gender === 'Женский' ? '👩' : '');
        legendHtml += '<span class="legend-item"><span class="color-box" style="background:' + studentColors[index % studentColors.length] + '"></span>' + genderIcon + ' ' + s.name + '</span>';
    });
    legendContainer.innerHTML = legendHtml;
    
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: sortedForDisplay.map(function(s) { return s.name.length > 15 ? s.name.substring(0, 13) + '…' : s.name; }),
            datasets: [
                {
                    label: '1-ое полугодие',
                    data: sortedForDisplay.map(function(s) { return s.sem1; }),
                    backgroundColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + '88'; }),
                    borderColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length]; }),
                    borderWidth: 2,
                    borderRadius: 4,
                    order: 1
                },
                {
                    label: '2-ое полугодие',
                    data: sortedForDisplay.map(function(s) { return s.sem2; }),
                    backgroundColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + '66'; }),
                    borderColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length]; }),
                    borderWidth: 2,
                    borderRadius: 4,
                    order: 2
                },
                {
                    label: 'За год',
                    data: sortedForDisplay.map(function(s) { return s.year; }),
                    backgroundColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + 'AA'; }),
                    borderColor: sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length]; }),
                    borderWidth: 3,
                    borderRadius: 4,
                    order: 3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12, usePointStyle: true, pointStyle: 'circle' } },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            var val = context.parsed.y;
                            if (val === null || val === undefined) return '—';
                            var student = sortedForDisplay[context.dataIndex];
                            return student.name + ': ' + context.dataset.label + ' — ' + val.toFixed(1);
                        }
                    }
                },
                datalabels: {
                    display: function(context) {
                        var val = context.dataset.data[context.dataIndex];
                        return val !== null && val !== undefined;
                    },
                    color: '#1E293B',
                    font: { weight: 'bold', size: 10 },
                    anchor: 'end',
                    align: 'end',
                    offset: 3,
                    formatter: function(value) {
                        if (value === null || value === undefined) return '';
                        return value.toFixed(1);
                    }
                }
            },
            scales: {
                y: { beginAtZero: true, max: 10, title: { display: true, text: 'Средний балл', font: { size: 11, weight: 'bold' } }, ticks: { stepSize: 1, font: { size: 10 } } },
                x: { ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 30 } }
            }
        },
        plugins: [ChartDataLabels]
    });
    
    document.getElementById('chartNote').textContent = '* Студенты отсортированы по среднему баллу за год (' + course + ' курс)';
}

    chartInstance.data.labels = sortedForDisplay.map(function(s) { return s.name.length > 15 ? s.name.substring(0, 13) + '…' : s.name; });
    chartInstance.data.datasets[0].data = sortedForDisplay.map(function(s) { return s.sem1; });
    chartInstance.data.datasets[1].data = sortedForDisplay.map(function(s) { return s.sem2; });
    chartInstance.data.datasets[2].data = sortedForDisplay.map(function(s) { return s.year; });
    chartInstance.data.datasets[0].backgroundColor = sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + '88'; });
    chartInstance.data.datasets[1].backgroundColor = sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + '66'; });
    chartInstance.data.datasets[2].backgroundColor = sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length] + 'AA'; });

    chartInstance.data.datasets[1].borderColor = sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length]; });
    chartInstance.data.datasets[2].borderColor = sortedForDisplay.map(function(_, i) { return studentColors[i % studentColors.length]; });
    
    chartInstance.update();
    document.getElementById('chartNote').textContent = '* Студенты отсортированы по среднему баллу за год (' + course + ' курс)';
}

                '<thead><tr>' +
                    '<th style="border:1px solid #000;padding:2px 4px;background:#e9ecef;text-align:center;font-weight:700;font-size:10pt;width:8%;">№</th>' +
                    '<th style="border:1px solid #000;padding:2px 4px;background:#e9ecef;text-align:left;font-weight:700;font-size:10pt;width:40%;">ФИО</th>' +
                    '<th style="border:1px solid #000;padding:2px 4px;background:#e9ecef;text-align:center;font-weight:700;font-size:10pt;width:20%;">Дата рождения</th>' +
                    '<th style="border:1px solid #000;padding:2px 4px;background:#e9ecef;text-align:center;font-weight:700;font-size:10pt;width:12%;">Возраст</th>' +
                    '<th style="border:1px solid #000;padding:2px 4px;background:#e9ecef;text-align:center;font-weight:700;font-size:10pt;width:20%;">Телефон</th>' +
                '</tr></thead>' +
                '<tbody>';
        
        studentsData.forEach(function(s, i) {
            tableHtml += '<tr>' +
                '<td style="border:1px solid #000;padding:2px 4px;font-size:10pt;text-align:center;">' + (i + 1) + '</td>' +
                '<td style="border:1px solid #000;padding:2px 4px;font-size:10pt;word-wrap:break-word;">' + s.full_name + '</td>' +
                '<td style="border:1px solid #000;padding:2px 4px;font-size:10pt;text-align:center;">' + (s.birth_date ? formatDate(s.birth_date) : '—') + '</td>' +
                '<td style="border:1px solid #000;padding:2px 4px;font-size:10pt;text-align:center;">' + (s.birth_date ? calculateAge(s.birth_date) : '—') + '</td>' +
                '<td style="border:1px solid #000;padding:2px 4px;font-size:10pt;text-align:center;">' + (s.phone || '—') + '</td>' +
            '</tr>';
        });
        tableHtml += '</tbody></table>';
        
        var curatorText = staffData.curators.length > 0 ? staffData.curators.join(', ') : '—';
        var masterText = staffData.masters.length > 0 ? staffData.masters.join(', ') : '—';
        
        content.innerHTML = 
            '<div style="margin-bottom:2px;padding-bottom:2px;border-bottom:2px solid #000;text-align:center;">' +
                '<div style="font-size:15pt;font-weight:700;">Учреждение образования<br>"Витебский государственный аграрно-технический колледж"</div>' +
                '<div style="font-size:17pt;font-weight:700;margin-top:2px;text-transform:uppercase;">ОТЧЁТ ПО ГРУППЕ</div>' +
                '<div style="font-size:14pt;font-weight:600;margin-top:2px;">' + currentGroup.name + '</div>' +
                '<div style="font-size:11pt;margin-top:2px;">' +
                    '<div>Тип: ' + (typeLabels[currentGroup.type] || currentGroup.type) + '  |  Специальность: ' + specialtyText + '</div>' +
                    '<div>Квалификация: ' + qualificationText + '  |  Дата: ' + dateStr + '</div>' +
                '</div>' +
            '</div>' +
            tableHtml +
            '<div style="margin-top:4px;padding-top:4px;border-top:1px solid #000;font-size:11pt;">' +
                '<div><strong>Всего студентов: ' + studentsData.length + '</strong></div>' +
                '<div style="margin-top:2px;"><strong>Куратор:</strong> ' + curatorText + '</div>' +
                (currentGroup.type === 'pto' ? '<div><strong>Мастер ПО:</strong> ' + masterText + '</div>' : '') +
                '<div style="margin-top:2px;"><strong>Дата:</strong> ' + dateStr + '</div>' +
            '</div>';
        
        var opt = {
            margin: [4, 4, 4, 4],
            filename: 'Группа_' + currentGroup.name + '_' + dateStr.replace(/\./g, '-') + '.pdf',
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
        
        html2pdf().set(opt).from(content).save().then(function() {
            showToast('✅ Отчёт сохранён в PDF');
        }).catch(function(error) {
            showToast('❌ Ошибка создания PDF: ' + error.message, 'error');
        });
    };
}

// ============================================================
// РЕДАКТИРОВАНИЕ ГРУППЫ
// ============================================================
function openEditModal() {
    if (!currentGroup || !hasEditRights) return;

    document.getElementById('editGroupName').value = currentGroup.name || '';
    document.getElementById('editGroupType').value = currentGroup.type || 'pto';
    document.getElementById('editGroupStatus').value = currentGroup.is_archived ? 'archived' : 'active';
    document.getElementById('editDateStart').value = currentGroup.date_start || '';
    document.getElementById('editDateEnd').value = currentGroup.date_end || '';

    var mastersSection = document.getElementById('modalMastersSection');
    mastersSection.style.display = currentGroup.type === 'pto' ? 'block' : 'none';

    editSpecialties = Array.isArray(currentGroup.specialty) ? currentGroup.specialty.slice() : [];
    editQualifications = Array.isArray(currentGroup.qualification) ? currentGroup.qualification.slice() : [];
    renderEditTags('editSpecialtyList', editSpecialties, 'specialty');
    renderEditTags('editQualificationList', editQualifications, 'qualification');

    var curatorContainer = document.getElementById('viewCuratorList');
    var masterContainer = document.getElementById('viewMasterList');
    curatorContainer.innerHTML = staffData.curators.length > 0 
        ? staffData.curators.map(function(c) { return '<span class="tag-item">' + c + '</span>'; }).join('') 
        : '<span class="empty-tags" style="color:var(--text-muted);font-size:12px;">Нет кураторов</span>';
    masterContainer.innerHTML = staffData.masters.length > 0 
        ? staffData.masters.map(function(m) { return '<span class="tag-item">' + m + '</span>'; }).join('') 
        : '<span class="empty-tags" style="color:var(--text-muted);font-size:12px;">Нет мастеров</span>';

    document.getElementById('editGroupModal').classList.add('active');
}

async function saveGroupChanges() {
    var name = document.getElementById('editGroupName').value.trim();
    var type = document.getElementById('editGroupType').value;
    var status = document.getElementById('editGroupStatus').value;
    var dateStart = document.getElementById('editDateStart').value;
    var dateEnd = document.getElementById('editDateEnd').value;

    if (!name) { showToast('❌ Введите название группы', 'error'); return; }
    if (!dateStart) { showToast('❌ Укажите дату начала', 'error'); return; }
    if (!dateEnd) { showToast('❌ Укажите дату окончания', 'error'); return; }

    var updateData = {
        name: name,
        type: type,
        date_start: dateStart,
        date_end: dateEnd,
        specialty: editSpecialties,
        qualification: editQualifications,
        is_archived: status === 'archived',
        updated_at: new Date().toISOString()
    };

    try {
        var result = await sb.from('groups').update(updateData).eq('id', groupId);
        if (result.error) {
            console.error('❌ Ошибка Supabase:', result.error);
            throw result.error;
        }
        document.getElementById('editGroupModal').classList.remove('active');
        showToast('✅ Группа обновлена!', 'success');
        await loadGroup();
    } catch (error) {
        console.error('❌ Ошибка сохранения:', error);
        showToast('❌ Ошибка: ' + error.message, 'error');
    }
}

// ============================================================
// ВЫПУСК ГРУППЫ
// ============================================================
function bindGraduateButton() {
    document.getElementById('graduateGroupBtn').onclick = async function() {
        if (!currentGroup || !hasEditRights) {
            showToast('❌ У вас нет прав на это действие', 'error');
            return;
        }
        
        var result = await sb.from('students').select('id, full_name').eq('group_id', groupId).eq('status', 'active');
        var students = result.data;
        
        if (!students || students.length === 0) {
            showToast('❌ В группе нет активных студентов', 'error');
            return;
        }

        window.location.href = '/students/graduate-distribution?group_id=' + groupId;
    };
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
function bindPageHandlers() {
    document.getElementById('editGroupBtn').onclick = openEditModal;
    document.getElementById('modalSaveBtn').onclick = saveGroupChanges;
    document.getElementById('modalCloseBtn').onclick = function() { document.getElementById('editGroupModal').classList.remove('active'); };
    document.getElementById('modalCancelBtn').onclick = function() { document.getElementById('editGroupModal').classList.remove('active'); };
    document.getElementById('editGroupModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });

    document.getElementById('addStudentBtn').onclick = function() {
        if (!groupId || !hasEditRights) return;
        window.location.href = '/students/add-student?group_id=' + groupId;
    };

    bindExportPDF();
    bindGraduateButton();
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init() {
    if (window.Session && typeof window.Session.init === 'function') {
        try {
            var sessionOk = await window.Session.init();
            if (sessionOk === false) return;
        } catch (e) {
            console.warn('⚠️ Session.init() ошибка:', e);
        }
    }

    sb = getSupabaseClient();
    if (!sb) {
        console.error('❌ Не удалось получить клиент Supabase');
        showToast('❌ Ошибка подключения к базе данных', 'error');
        return;
    }

    waitForHeaderAndSidebar(function() {
        bindHeaderButtons();
        bindPageHandlers();
        
        loadUser().then(function() {
            loadGroup();
        });
    });
}

function boot() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
}

boot();
</script>
